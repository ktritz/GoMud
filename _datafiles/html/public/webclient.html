{{template "header" .}}

<style>
    #content-container {
        padding: 0 !important;
        align-items: stretch !important;
        overflow: hidden;
    }
    #webclient-frame {
        flex: 1;
        width: 100%;
        border: none;
        display: block;
    }
</style>

<iframe id="webclient-frame" src="/webclient-pure.html"></iframe>
<script type="text/javascript">
    // Hide header/nav/footer for full-screen terminal experience
    function resizeClientIFrame() {
        // No longer need JS pixel sizing - CSS flex handles it
    }
    window.addEventListener("load", resizeClientIFrame);
    window.addEventListener('resize', resizeClientIFrame);
    window.addEventListener('beforeunload', function(event) {
        event.preventDefault();
        event.returnValue = 'Leave/Disconnect from the MUD?';
    });
</script>
{{template "footer" .}}
