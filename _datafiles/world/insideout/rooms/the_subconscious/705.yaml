roomid: 705
zone: The Subconscious
title: The Clown Room
description: 'The walls of this room are covered in peeling circus wallpaper -- faded stripes and polka dots in colors that were once cheerful but have curdled into something deeply wrong. Broken toys litter the floor: a jack-in-the-box with its spring permanently extended and its painted face frozen mid-scream, a music box that plays its tune backwards, a handful of deflated balloon animals twisted into shapes that do not exist in nature. A sticky residue covers everything, the same pink as old bubblegum, and the air reeks of stale cotton candy and greasepaint. This is the anteroom to something worse. You can hear the rhythmic squeak of enormous shoes from the chamber to the north, accompanied by the occasional honk of a bicycle horn that echoes off the stone walls like a threat.'
mapsymbol: '!'
