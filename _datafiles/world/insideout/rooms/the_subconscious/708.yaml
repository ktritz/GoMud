roomid: 708
zone: The Subconscious
title: Basement Stairs
description: A narrow stone staircase spirals downward into the deeper levels of the Subconscious, each step worn smooth by the passage of things that prefer to move in the dark. The walls are close enough to touch on both sides, and they are cold and slightly damp, covered in a thin film of condensation that makes everything slick. A single bare lightbulb hangs from a wire at the top of the stairs, swinging gently in a draft that comes from below, casting swaying shadows that make the stairs look like they are moving. The air gets colder with each step down, and the silence gets louder, if that makes any sense. It doesn't. That's the point.
