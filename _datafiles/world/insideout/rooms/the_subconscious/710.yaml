nouns:
  webs: The <ansi fg="itemname">webs</ansi> are made of pure crystallized anxiety, each strand as thin as a hair but strong enough to hold your weight. They vibrate faintly at a frequency you can feel in your teeth, and when touched, they whisper worst-case scenarios in a voice that sounds like your own internal monologue on a very bad day. The strands are sticky and warm.
  bundles: The <ansi fg="itemname">bundles</ansi> hanging from the web are tightly wrapped cocoons of anxiety silk. Most are small -- wrapped-up fears, worries, and bad dreams that the spiders have collected and stored for later. A few are larger and shift occasionally, as if whatever is inside is not entirely unconscious. You do not want to know what is in the biggest one.
