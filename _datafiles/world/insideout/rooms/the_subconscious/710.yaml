roomid: 710
zone: The Subconscious
title: Spider Nest
description: Thick webs of crystallized fear stretch across this chamber in dense, overlapping layers, turning the room into a three- dimensional maze of sticky, glittering strands. The webs refract the dim light into sickly prismatic patterns that shift across the walls like an oil slick. Wrapped bundles hang from the ceiling at various heights -- some small, some disturbingly person-shaped -- each one cocooned in layer after layer of anxiety silk. The floor is carpeted with shed exoskeletons and the brittle remains of previous webs, crunching underfoot with every step. The spiders that built this place are still here, their crystallized bodies catching the light as they move through the web with a clicking, tapping rhythm that never quite stops.
mapsymbol: X
maplegend: Nest
biome: dungeon
exits:
  south:
