nouns:
  exhibits: The <ansi fg="itemname">exhibits</ansi> are displayed with museum-quality precision. The Heights exhibit features a glass floor over an infinite drop that makes your stomach lurch even though you know it is not real. The Dark exhibit is a sealed chamber with a window -- inside, it is a darkness so complete that staring into it feels like the darkness is staring back. The Clowns exhibit is a miniature stage with a tiny Jangles figure that follows you with its eyes. The Spiders exhibit contains a single web with a sign reading "EXHIBIT TEMPORARILY ESCAPED." The Public Speaking exhibit is a podium facing a thousand empty chairs that somehow feel occupied.
  plaques: 'The brass <ansi fg="itemname">plaques</ansi> read like parodies of museum descriptions. "ACROPHOBIA (Fear of Heights): First manifested age 6, Grandpa''s balcony incident. Current severity: Moderate. Note: Elevators with glass walls remain problematic." "ARACHNOPHOBIA (Fear of Spiders): See Exhibit -- oh, it escaped again. Please report any sightings." "GLOSSOPHOBIA (Fear of Public Speaking): Current severity: EXTREME. The empty chairs can hear your heartbeat."'
idlemessages:
- The glass floor of the Heights exhibit ripples and the infinite drop below seems to deepen.
- The tiny Jangles figure on the Clowns stage turns to face you, then freezes when you look at it.
- The empty chairs in the Public Speaking exhibit creak, as if an invisible audience just leaned forward.
- The Darkness exhibit window fogs over and when it clears, the darkness inside is closer to the glass.
- A thread of spider silk drifts down from the ceiling near the Spiders exhibit. The sign was not lying.
