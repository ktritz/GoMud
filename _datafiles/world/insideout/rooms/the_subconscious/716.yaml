roomid: 716
zone: The Subconscious
title: The Phobia Gallery
description: This wide, vaulted chamber has been arranged like a museum gallery, with individual exhibits mounted on pedestals and displayed behind thick glass that fogs and clears in slow, breathing cycles. Each exhibit represents one of Riley's phobias, preserved and presented with the clinical detachment of a natural history museum -- if the natural history museum was curated by something that enjoyed watching people squirm. Soft lighting illuminates each display, and small brass plaques provide educational descriptions that manage to make everything worse. The gallery is arranged in a circle, so no matter where you stand, at least one exhibit is behind you.
mapsymbol: P
maplegend: Phobias
