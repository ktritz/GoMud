nouns:
  gate: The <ansi fg="itemname">gate</ansi> is a slab of riveted iron set directly into the stone of the mind. Scratch marks cover the interior side -- long, desperate gouges from things that tried to claw their way out. The hinges are massive and well-oiled, which is somehow worse than if they were rusted shut. Someone maintains this gate. Someone expects it to be used.
  padlock: The <ansi fg="itemname">padlock</ansi> is shaped like a grotesque clown nose, bright red and slightly rubbery to the touch. It is far heavier than it looks and faintly warm, as though something on the other side is breathing on it. The keyhole is shaped like a tiny, grinning mouth.
idlemessages:
- Something behind the gate shifts heavily, and the bars vibrate with a low hum.
- A faint, high-pitched giggle drifts through the gaps in the gate and then abruptly stops.
- The padlock sways on its own, as if nudged by something you cannot see.
- Cold air pulses through the gate in slow, rhythmic waves, like breathing.
- The scratch marks on the gate seem to have multiplied since you last looked.
