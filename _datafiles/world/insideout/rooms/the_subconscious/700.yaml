roomid: 700
zone: The Subconscious
title: Subconscious Gate
description: A massive iron gate stands before you, riveted with bolts the size of fists and streaked with rust that looks disturbingly like dried blood in the dim light. The words "DO NOT OPEN" have been scratched into the metal from the inside, and someone on this side has added "SERIOUSLY" in yellow paint. A heavy padlock shaped like a clown nose secures the gate, and cold air seeps through the gaps between the bars, carrying with it the unmistakable smell of old rubber and stale birthday cake. Beyond the gate, a corridor descends into a darkness so complete it seems to push back against any light that tries to enter. Whatever is locked in here wants out, and whatever locked it in here had very good reasons.
