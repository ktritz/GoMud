roomid: 715
zone: The Subconscious
title: Nightmare Storage
description: 'Floor-to-ceiling metal shelves line this long, narrow room, stacked with sealed containers of every size -- crates, jars, locked boxes, and vacuum-sealed bags, each one labeled with a date and a brief, clinical description of the nightmare inside. The containers hum and vibrate on the shelves, some rattling so hard they walk toward the edge before settling back. The lighting is harsh fluorescent that makes everything look sterile and clinical, like a hospital for bad dreams. A logistics board on the wall tracks inventory with obsessive precision: "NIGHTMARE #4,872: THE ONE WHERE YOUR TEETH FALL OUT. STATUS: CONTAINED. BARELY."'
mapsymbol: N
maplegend: Storage
biome: dungeon
