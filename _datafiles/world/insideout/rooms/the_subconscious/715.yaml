nouns:
  shelves: The <ansi fg="itemname">shelves</ansi> are industrial-grade steel, bolted to the walls and floor with brackets rated for extreme containment. Despite this, several brackets are bent, and one shelf unit has been pushed back a full inch from the wall by the force of whatever is vibrating inside the containers on it.
  containers: 'The <ansi fg="itemname">containers</ansi> are labeled with an efficient, joyless filing system. "NM-001: FALLING DREAM (RECURRING, HIGH INTENSITY)." "NM-347: SHOWING UP TO SCHOOL IN UNDERWEAR (CLASSIC, PERSISTENT)." "NM-1,204: THAT THING WITH THE STAIRS THAT GO NOWHERE (SURREAL, UNSETTLING)." One container near the bottom is just labeled "DO NOT" with no further description.'
idlemessages:
- A container on a high shelf rattles violently, then stops with a thud.
- The fluorescent lights buzz louder and one of the sealed jars glows faintly from within.
- A label peels off a container and you catch the words "the one where everyone is staring at you."
- Something inside a crate scratches at the lid in a slow, deliberate pattern.
- The logistics board updates itself with a soft click. A new entry reads "STATUS -- RESTLESS."
