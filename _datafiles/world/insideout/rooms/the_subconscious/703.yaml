roomid: 703
zone: The Subconscious
title: Cell Block B
description: The second cell block is older and less maintained than the first, its iron bars tarnished to a dull black and its walls covered in a network of hairline cracks that pulse faintly with a sickly purple light. The cells here hold the deeper fears -- the ones Riley does not even know she has. There are no labels on these doors, just tally marks scratched into the metal by whatever is inside. The air is heavier here, thick with the psychic weight of accumulated dread, and the fluorescent lights have given up entirely, replaced by a dim bioluminescent glow that seeps from the cracks in the walls like something alive. The passage continues deeper, past cells that nobody has checked in a very long time.
