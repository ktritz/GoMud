roomid: 704
zone: The Subconscious
title: Grandma's Vacuum Cleaner Room
description: This oversized cell has been converted into a containment chamber for one of Riley's oldest, most primal fears -- Grandma's vacuum cleaner. The enormous vacuum dominates the center of the room, a chrome-and-plastic monstrosity from the 1990s that towers over you on wheels the size of dinner plates. Its cord trails across the floor like a dead snake, and its bag is distended and bulging with something that makes muffled thumping sounds. The machine is unplugged, but the power light on its handle blinks intermittently anyway, and the hose twitches in your direction when you get too close. Fear constructs have been drawn to this room, nesting in the corners like moths around a very loud, very terrifying flame.
mapsymbol: V
maplegend: Vacuum
biome: dungeon
