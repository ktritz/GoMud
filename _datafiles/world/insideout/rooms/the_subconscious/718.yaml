roomid: 718
zone: The Subconscious
title: Emergency Exit
description: A narrow, hastily constructed tunnel punches through the back wall of the Subconscious, shored up with mismatched timber and corrugated metal panels that rattle with every tremor from the cracking floors behind you. A faded emergency sign bolted above the tunnel entrance reads "EMERGENCY EGRESS TO LONG TERM MEMORY -- USE ONLY IN CASE OF CATASTROPHIC FEAR BREACH." The tunnel angles sharply upward, climbing toward the distant glow of the memory shelves above. The air here is warmer and cleaner than the rest of the Subconscious, carrying the faint smell of stored memories and the promise of safety. After everything you have seen down here, the exit feels less like an architectural feature and more like a mercy.
