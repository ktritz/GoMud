roomid: 702
zone: The Subconscious
title: Cell Block A
description: The corridor opens into a wide chamber lined with heavy iron cells on both sides, their bars thick enough to hold back whatever Riley's mind decided was too frightening to roam free. Most of the cells are dark and quiet, their occupants either sleeping or long since dissolved, but a few contain shapes that shift restlessly in the shadows. Faded labels are bolted to each cell door -- "THAT NOISE IN THE ATTIC," "THE THING UNDER THE BED," "SUBSTITUTE TEACHER WITH THE LAZY EYE." The floor is scuffed with drag marks leading deeper into the prison. Fluorescent lights overhead flicker in an arrhythmic pattern that is deeply, specifically unsettling.
mapsymbol: A
maplegend: Block-A
