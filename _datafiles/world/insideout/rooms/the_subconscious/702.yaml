nouns:
  cells: The <ansi fg="itemname">cells</ansi> are built from reinforced iron and something that looks like hardened thought-stuff. Most are empty, their doors hanging open, but a few are sealed shut with extra padlocks. One cell contains what appears to be an extremely large spider made of shadow. Another holds a shape that looks like a dentist's chair. A third is completely dark except for two faintly glowing eyes at the back.
  labels: The <ansi fg="itemname">labels</ansi> are typed on little brass plates in a clinical font. Some are mundane -- "LOSING A TOOTH," "FORGETTING HOMEWORK." Others are more specific and alarming -- "THAT TIME THE ESCALATOR STOPPED AND NOBODY KNEW WHAT TO DO," "THE POSSIBILITY THAT DOGS DON'T ACTUALLY LIKE YOU."
idlemessages:
- Something in one of the sealed cells throws itself against the bars with a heavy clang.
- The fluorescent lights flicker off for exactly two seconds, then snap back on.
- A low moan drifts from the darkest cell at the end of the row, then trails off into silence.
- One of the cell labels spins on its bolt, clicking softly as it rotates.
- You hear the distinct sound of something dragging itself across a stone floor deeper in the block.
