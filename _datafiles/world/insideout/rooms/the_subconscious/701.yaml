roomid: 701
zone: The Subconscious
title: The Dark Corridor
description: The corridor beyond the gate is swallowed by a darkness so thick it feels physical, pressing against your skin like cold water. The walls are rough stone that glistens with condensation, and the floor slopes steadily downward into the unseen depths of Riley's deepest fears. Without a light source, you can barely see your own hands. The silence is oppressive and total, broken only by the faint drip of water from somewhere far below and the persistent feeling that the darkness itself is watching you, patiently, the way a spider watches a fly that has just landed on the very edge of its web.
