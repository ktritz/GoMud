nouns:
  pit: The <ansi fg="itemname">pit</ansi> is unnervingly symmetrical, a perfect circle of black stone polished smooth by forces that predate Riley's conscious mind. The stone is cold to the touch -- not the cold of a basement, but the cold of deep space, the cold of the void between thoughts. Standing in the center makes you feel very small and very observed.
  dust: The black <ansi fg="itemname">dust</ansi> is impossibly fine, like ground-up darkness. It clings to your shoes and dampens every sound to nothing. If you scoop up a handful, it feels weightless and slightly warm, and for a moment you feel a flash of something -- a fear you cannot name, from a time before you had words for anything.
idlemessages:
- The black dust on the floor shifts in a slow spiral pattern, as if stirred by an invisible finger.
- The silence deepens until you can hear your own heartbeat echoing off the walls.
- Something in the darkness above shifts, and a cascade of fine black dust drifts down like dark snow.
- The walls seem to contract slightly, then expand, as if the pit is breathing.
- A wave of primal unease washes over you for no reason you can identify, then passes.
