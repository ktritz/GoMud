roomid: 709
zone: The Subconscious
title: The Dark Pit
description: The stairs end at the bottom of a vast, circular pit carved from black stone that absorbs light like a sponge. This is the deepest point of the Subconscious, where the heaviest fears eventually settle like sediment. The ceiling is lost in darkness high above, and the walls curve inward, giving the space the feel of being inside a closed fist. The floor is covered in a fine black dust that muffles every sound, and the air is so still it feels like the room is holding its breath. There is a profound, primal wrongness to this place -- the kind of fear that exists before language, before reason, before anything except the certainty that you are not supposed to be here.
mapsymbol: O
maplegend: Pit
biome: dungeon
