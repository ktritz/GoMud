roomid: 712
zone: The Subconscious
title: Shadowy Alcove
description: A narrow recess in the stone wall has been carved into a small chamber that seems specifically designed to make you feel observed. The shadows here do not behave normally -- they pool in corners that should not have shadows, stretch in directions opposite to any light source, and occasionally shift when you are looking directly at them. A tall, dark silhouette stands against the far wall, perfectly still, its hollow eyes level with yours. It might be a trick of the light. It is not a trick of the light. The air in here is thick with the psychic weight of every time Riley questioned herself, every moment of "am I good enough" given form and substance and a pair of empty, staring eyes.
mapsymbol: '?'
maplegend: Alcove
biome: dungeon
exits:
  south:
