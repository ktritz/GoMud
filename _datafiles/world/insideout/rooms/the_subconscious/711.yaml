roomid: 711
zone: The Subconscious
title: Creaky Attic
description: A low-ceilinged space that feels impossibly like the attic of a house that does not exist, crammed with dusty boxes and forgotten junk piled in precarious towers that lean at alarming angles. The floorboards are warped and uneven, creaking loudly with every step, and the sloped ceiling forces you to duck in places. A single dirty window is set into one wall, but the glass is opaque with grime and the light that filters through is the wrong color -- a sickly, late-afternoon amber that belongs to no specific time of day. The attic smells like dust, old cardboard, and the peculiar dread of hearing a noise from upstairs when you are home alone.
