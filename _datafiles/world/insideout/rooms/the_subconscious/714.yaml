roomid: 714
zone: The Subconscious
title: Guard Station
description: An abandoned guard post sits at the junction of two corridors, its desk still covered in paperwork that no one will ever finish. A chair is overturned behind the desk, and a cold cup of coffee sits untouched next to a half-eaten sandwich that has been here so long it has become something new and disturbing. Whoever was stationed here left in a hurry -- the drawers are open, a clipboard is on the floor, and the security monitors mounted to the wall show nothing but static on every channel. A calendar pinned to the wall is open to a date that has not happened yet.
mapsymbol: S
maplegend: Guard
biome: dungeon
