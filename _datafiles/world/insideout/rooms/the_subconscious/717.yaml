roomid: 717
zone: The Subconscious
title: Cracked Floor
description: The stone floor of this corridor is fractured into a web of deep cracks that glow faintly with a dull red light from somewhere far below. The cracks widen as you move forward, some broad enough to see down into -- though what you see is just more darkness, pulsing with that same sullen red glow. The walls here are unstable, shedding flakes of stone that crumble to dust before they hit the floor, and the ceiling sags dangerously in places, supported by makeshift braces that look like they were installed in a panic. The structural integrity of this section of the Subconscious is failing, worn thin by the weight of fears pressing down from above and the void pulling from below. Every step sends a network of new cracks racing ahead of you.
