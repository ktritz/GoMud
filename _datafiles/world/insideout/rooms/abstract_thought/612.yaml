roomid: 612
zone: Abstract Thought
title: Logical Paradox Room
description: A room that shouldn't work but does. Four doors lead out, each clearly labeled with a direction, but the directions don't correspond to where they actually go. An Escher-esque staircase in the center climbs upward and somehow arrives back at its own base. Water flows uphill in a narrow channel along one wall. A clock runs forward and backward simultaneously, its two sets of hands crossing and uncrossing in an endless dance. A sign on the wall reads "THIS STATEMENT IS FALSE" and the letters rearrange themselves every time you read it. The room functions perfectly despite violating every rule it can find. Abstraction's last joke before letting you leave.
