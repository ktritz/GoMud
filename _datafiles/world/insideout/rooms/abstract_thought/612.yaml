nouns:
  doors: The <ansi fg="itemname">doors</ansi> are clearly labeled but the labels are lies. "North" leads south. "Exit" leads deeper in. One door is labeled "This door does not exist" and yet you can open it. Another is labeled "Entrance" from both sides. The doors work fine; it's the concept of direction that's having an off day.
  staircase: 'The <ansi fg="itemname">staircase</ansi> is a perfect Penrose construction -- four flights of stairs that each go up and yet form a closed loop that arrives where it started. Walking it is disorienting but not unpleasant. Someone has left a small sign at the base: "Great exercise. Infinite cardio."'
idlemessages:
- The staircase completes another impossible loop, and a small breeze swirls at its base.
- The clock's two sets of hands meet, and time pauses for exactly zero seconds.
- Water flows uphill, pauses at the top, and flows uphill again from there.
- A door opens and closes simultaneously, which is fine if you don't think about it.
- The paradox sign rearranges to read "THIS STATEMENT IS TRUE" then back again.
