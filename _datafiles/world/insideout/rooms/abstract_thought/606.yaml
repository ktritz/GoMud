roomid: 606
zone: Abstract Thought
title: Scattered Fragments
description: 'Pieces of what used to be reality float in a slow, silent orbit around nothing in particular. A fragment of a face drifts past -- just the smile, disconnected from any mouth. A triangle of blue sky hangs in the air next to a rectangle of grass, but they don''t connect to form a landscape. Sounds have deconstructed too: you hear vowels without consonants, rhythms without melody, the emotional weight of music without any actual notes. Gravity is a suggestion that''s been politely declined. You can still walk, but only because some part of your mind insists that walking is a thing that makes sense. The fragments are beautiful -- each one a perfect piece of something -- but they refuse to become a whole.'
mapsymbol: F
maplegend: Fragments
biome: abstract
