nouns:
  displays: The <ansi fg="itemname">displays</ansi> are textbook-perfect representations of Riley's stored knowledge. The solar system model has all the planets in the right order, though Pluto is hovering at the edge, unsure if it belongs. A DNA helix rotates slowly in another case. A map of the United States has Minnesota and California highlighted in gold.
  labels: 'The <ansi fg="itemname">labels</ansi> are crisp and informative. "THE SUN: A star. Approximately 93 million miles away. Hot." "GRAVITY: The reason things fall down. Also the reason Riley can''t dunk." Perfectly factual, if occasionally editorial.'
idlemessages:
- The miniature solar system continues its silent orbit, Jupiter's tiny moons trailing behind.
- A display flickers and updates itself, adding a new fact Riley learned today.
- The hallway ahead warps for a split second, then snaps back to normal. Probably nothing.
- The periodic table glows brighter at carbon, as if something organic is thinking nearby.
- A label rewrites itself slightly, trading clinical language for something more casual.
