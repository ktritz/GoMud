roomid: 601
zone: Abstract Thought
title: The Factual Hallway
description: A long, straight corridor stretches before you, its walls lined with neatly organized displays of factual information rendered in perfect three-dimensional dioramas. A miniature solar system orbits silently in one alcove. A periodic table glows on the opposite wall, each element represented by a tiny floating cube of the actual substance. The floor is solid, the ceiling is where it should be, and the lighting comes from a logical source. Labels beneath each display are written in clean, legible text. This is the last place in Abstract Thought where information presents itself in a way that a normal mind would consider "correct." The hallway ahead shimmers slightly, as if reality is starting to loosen.
