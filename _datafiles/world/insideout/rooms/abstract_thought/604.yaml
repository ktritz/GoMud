nouns:
  outlines: The <ansi fg="itemname">outlines</ansi> are ghostly traces of objects that once had mass. Riley's silhouette is recognizable -- the ponytail, the posture -- but she's only lines now, a contour drawing with nothing inside. If you step into the outline, you feel a faint echo of the form it once held, like a memory of shape.
  frames: The <ansi fg="itemname">frames</ansi> hang at precise intervals, each one containing a single geometric shape where complex art used to be. A landscape of San Francisco has become a series of overlapping triangles. A family portrait is five colored circles of different sizes. The abstraction has reduced everything to its simplest possible representation.
