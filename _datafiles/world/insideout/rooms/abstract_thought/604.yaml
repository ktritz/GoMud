roomid: 604
zone: Abstract Thought
title: Flattened Gallery
description: An exhibition space that has been ironed flat by abstraction. What were once three-dimensional sculptures are now outlines -- perfect contours of their former selves, pressed into the floor and walls like botanical specimens in a book. A statue of Riley exists only as a silhouette. A model of Headquarters is a floor plan with no walls. Frames hang on the walls but they contain shapes rather than images -- a red square where a portrait used to be, a blue circle where a landscape once hung. You can walk through objects because they're only edges now. The gallery is beautiful in a stark, alien way, like a blueprint of the world with all the detail stripped out.
