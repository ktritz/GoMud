nouns:
  platform: The <ansi fg="itemname">platform</ansi> is reassuringly solid. Real stone, real metal, real geometry. After the journey through abstraction, the reliability of a flat surface you can trust is almost moving.
  railing: The <ansi fg="itemname">railing</ansi> is cold iron, bolted firmly to the platform. It has height, width, and depth, and it exists in exactly one location. After the Non-Figurative Core, this is luxury.
  telescope: The <ansi fg="itemname">telescope</ansi> is a brass instrument on a smooth swivel. Through it, you can see Dream Productions' spotlights sweeping, the warm glow of Headquarters' Console Room, and far below, Mind Workers shuffling memory orbs along the shelves. A placard reads "You are here. Everything else is there. Isn't that nice?"
idlemessages:
- The distant spotlights of Dream Productions sweep across the mindscape like searchlights.
- A warm glow from Headquarters pulses once, as if Riley just had a happy thought.
- The abstract zones below shimmer, their geometries visible but safely incomprehensible from here.
- Through the telescope, you can see a Mind Worker waving, or possibly just shelving an orb.
- A breeze carries the faint scent of something real -- grass, or rain, or home.
