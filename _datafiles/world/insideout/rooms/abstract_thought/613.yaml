roomid: 613
zone: Abstract Thought
title: Abstract Overlook
description: A wide platform extends over the edge of Abstract Thought, offering a panoramic view of Riley's inner mindscape. From this vantage point, you can see the distant glow of Headquarters above and to the north, the warm lights of Dream Productions to the west, and the endless shelves of Long Term Memory stretching south. The railing is solid here -- fully reconstructed, real, three-dimensional -- and leaning against it feels like returning to shore after being lost at sea. The air is clear, the light is natural, and everything makes sense again. Below the overlook, the abstract zones shimmer like heat haze, their impossible geometries visible but safely distant. A telescope mounted on a swivel stand lets you survey the landscape.
mapsymbol: O
maplegend: Overlook
biome: abstract
