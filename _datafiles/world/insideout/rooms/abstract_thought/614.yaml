roomid: 614
zone: Abstract Thought
title: Escape Chute
description: 'A wide, smooth chute angles steeply downward, its interior walls polished to a mirror finish and lit by strips of calm blue light. A sign above the entrance reads "EMERGENCY EXIT -- RETURNS TO LONG TERM MEMORY. Please keep arms and existential crises inside the chute at all times." The chute is clearly designed as a quick escape route for anyone who has gone too deep into abstraction and needs to get back to concrete reality fast. A rubber mat at the entrance provides a place to sit before sliding, and a basket of helmets sits nearby with a note: "Optional but recommended. The landing is mostly soft." The blue lights pulse in a gentle downward pattern, inviting you to let go and slide.'
mapsymbol: '>'
maplegend: Chute
biome: abstract
