nouns:
  chute: The <ansi fg="itemname">chute</ansi> is a masterwork of mental engineering. Its polished interior is frictionless and the angle is precisely calculated for a ride that's fast enough to be thrilling but controlled enough to be safe. Blue lights line the interior in a steady downward cascade, and the faint scent of ozone gives way to the familiar dusty smell of Long Term Memory as the chute descends. The trip takes about ten seconds and deposits you gently into the memory stacks.
  mat: 'The <ansi fg="itemname">rubber mat</ansi> is worn smooth from years of abstract refugees sitting down and preparing for the ride back to reality. Several messages are scratched into the rubber: "I was a line segment for ten minutes" and "5 stars, would deconstruct again."'
  helmets: The <ansi fg="itemname">helmets</ansi> are colorful and slightly oversized. Each one has "ABSTRACT THOUGHT SURVIVOR" printed on the front and a sticker chart on the back tracking how many trips through the zone the wearer has survived. One helmet has seventeen stickers. That person has seen things.
idlemessages:
- The blue lights pulse downward in a steady, inviting rhythm.
- A faint whoosh echoes up the chute as something -- or someone -- arrives at the bottom.
- The helmets rattle in the basket as a breeze from the chute swirls through the room.
- A small sign beside the chute flips between "OPEN" and "WHEEE" at regular intervals.
- The scent of old books and dust drifts up from the chute -- Long Term Memory, calling you back.
