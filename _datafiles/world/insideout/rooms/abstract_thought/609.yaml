roomid: 609
zone: Abstract Thought
title: Line Segment Passage
description: 'Beyond the Shape Chamber, abstraction has reached its most minimal state. This passage consists of lines -- nothing more. Parallel lines define a path forward. Perpendicular lines suggest walls. A single diagonal line overhead implies a ceiling. There is no color, no texture, no mass -- only geometry in its most reduced form, the skeleton of a corridor with all the flesh removed. You move along the lines because they suggest movement, and your mind fills in everything else: the sense of floor, the feeling of enclosure, the impression of direction. The intersections where lines cross glow faintly, the only points of emphasis in this wireframe world.'
mapsymbol: '-'
maplegend: Lines
biome: abstract
