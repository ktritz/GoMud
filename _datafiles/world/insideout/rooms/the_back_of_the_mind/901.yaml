roomid: 901
zone: The Back of the Mind
title: Suppression Corridor
description: The corridor beyond the sealed door is a study in enforced calm -- every surface is coated in a matte, sound-dampening material that absorbs noise, color, and apparently feelings themselves. The walls are a washed-out gray that used to be something brighter, and the floor is padded with a soft, clinical carpet that muffles your footsteps to nothing. Recessed lights in the ceiling cast an even, shadowless glow that eliminates all contrast. Nothing in this corridor has edges. Nothing has texture. Nothing has personality. It is the architectural equivalent of taking a deep breath and pushing everything down, down, down until you cannot feel it anymore. And yet the walls pulse, just barely, with colors trying to break through.
mapsymbol: .
maplegend: Suppression
biome: dungeon
