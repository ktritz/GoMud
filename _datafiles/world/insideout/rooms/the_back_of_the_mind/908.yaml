roomid: 908
zone: The Back of the Mind
title: Repression Hall
description: A long, straight hallway that stretches farther than it should, its perspective lines converging on a vanishing point that you never seem to reach. The walls are lined with identical gray panels set at precise intervals, each one a sealed compartment containing a repressed experience. Small indicator lights on each panel glow in muted colors -- the faded ghosts of whatever emotion the experience originally carried. The hallway is perfectly climate-controlled, perfectly lit, and perfectly silent, which makes the occasional muffled thump from behind a panel all the more jarring. Walking down this hall feels like scrolling through a list of things you have decided not to think about.
mapsymbol: '='
maplegend: Hall
biome: dungeon
