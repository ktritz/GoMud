nouns:
  panels: The gray <ansi fg="itemname">panels</ansi> are numbered but not labeled -- the contents have been deliberately anonymized, as if even naming them might let them loose. Pressing your ear to one, you can hear a muffled conversation. Another vibrates with what feels like held-back tears. A third is warm to the touch and pulses with a faint red glow. None of them open.
  lights: The indicator <ansi fg="itemname">lights</ansi> are small LEDs that glow in washed-out versions of emotion colors. Faded gold for suppressed joy. Pale blue for buried sadness. Dim red for swallowed anger. The lights pulse at different rates, and if you watch long enough, you realize the pulses are synced to Riley's heartbeat.
idlemessages:
- A panel thumps from the inside, and its indicator light flashes bright before dimming again.
- The hallway seems to stretch longer ahead of you, though you have been walking for a while.
- A muffled laugh leaks from one panel, followed by abrupt silence as the suppression field clamps down.
- The indicator lights along the hall pulse in a slow wave, like a heartbeat rolling down the corridor.
- You pass a panel that is warm to the touch. Something inside is still fighting.
