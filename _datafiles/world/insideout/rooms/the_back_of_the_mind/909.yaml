roomid: 909
zone: The Back of the Mind
title: The Glass Jar Room
description: 'A vast, circular room illuminated by the soft glow of hundreds of jars arranged on tiered shelves that spiral from floor to ceiling. Each jar contains a miniature scene playing on loop -- a preserved emotion frozen at its peak intensity. The scenes are vivid and startlingly intimate: a child running to hug a parent, a teenager crying in a bathroom stall, a girl screaming into a pillow after a fight, a quiet moment of disgust at a questionable cafeteria meal. The jars glow with the color of their emotion, turning the room into a kaleidoscope of feeling that the Back of the Mind has tried to archive and forget. A viewing bench sits in the center, as if someone comes here sometimes to remember what feelings look like.'
mapsymbol: O
maplegend: Jars
biome: dungeon
