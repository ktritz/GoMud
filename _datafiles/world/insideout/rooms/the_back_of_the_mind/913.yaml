roomid: 913
zone: The Back of the Mind
title: Belief Thread Workshop
description: 'A cluttered workshop strung with thousands of luminous threads that connect the Back of the Mind to the Belief System beyond. The threads are living things -- glowing filaments of self-perception that carry Riley''s beliefs about herself between her conscious and suppressed minds. Each thread hums with a different conviction: "I am brave," "I am not enough," "I can do hard things," "Nobody really understands me." Workbenches line the walls, covered in tools for repairing damaged threads and spinning new ones. Some threads are bright and strong. Others are frayed, their messages garbled by suppression. A few have been cut entirely, their severed ends sparking weakly.'
mapsymbol: T
maplegend: Threads
biome: dungeon
