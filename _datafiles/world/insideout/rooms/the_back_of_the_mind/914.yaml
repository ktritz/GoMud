nouns:
  valve: 'The <ansi fg="itemname">valve</ansi> is a masterpiece of mental engineering, a physical metaphor made real. Its wheel requires significant effort to turn, and the resistance increases the more you open it -- as if the act of letting yourself feel requires more courage the further you go. The metal is warm to the touch and vibrates with the pressure of everything behind it. A small plaque reads "CAUTION: Opening this valve may result in experiencing your own emotions. Proceed with care and self-compassion."'
  vapor: The colored <ansi fg="itemname">vapor</ansi> escaping from the valve is a visible stream of raw emotion returning to consciousness. Golden joy sparks and crackles. Blue sadness flows like water. Red anger hisses like steam. The vapors intertwine as they rise, mixing into something that is not any single emotion but all of them together -- the complicated, messy, beautiful experience of being a person who feels things.
idlemessages:
- The pressure gauge ticks up a notch and the valve hisses louder, releasing a burst of golden vapor.
- A plume of blue sadness vents from the valve and you feel your eyes sting for a moment.
- The valve wheel turns a fraction on its own as the pressure builds behind it.
- Mixed emotion vapor swirls through the air and for a moment you feel everything at once -- then it settles.
- The pressure gauge drops slightly and the room feels lighter, as if something that needed to be felt was finally felt.
