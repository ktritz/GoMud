roomid: 914
zone: The Back of the Mind
title: The Release Valve
description: At the far end of the Back of the Mind, a massive industrial valve is set into the wall, its wheel the size of a dining table and its pipes disappearing into the structure of Riley's mind in every direction. This is the pressure release for the entire suppression system -- the emergency mechanism that allows bottled emotions to vent safely back into conscious feeling. The valve is currently cracked open, a thin stream of colored vapor hissing from its seal, and the pressure gauge mounted above it reads just below the red zone. The air here is thick with escaped emotion -- wisps of joy, grief, anger, and fear all tangled together in a rich, overwhelming tapestry of feeling. It is a lot. It is supposed to be a lot. That is the whole point.
