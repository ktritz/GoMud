roomid: 910
zone: The Back of the Mind
title: Anxiety's War Room
description: This is where Anxiety orchestrated her takeover of Headquarters -- a cramped, intensely organized command center covered wall-to-wall with plans, maps, and contingency documents. A massive corkboard dominates one wall, connected by a spiderweb of orange string that links photos, notes, and newspaper clippings into an elaborate conspiracy of worry. A central table holds a detailed model of Headquarters with tiny figurines of each emotion, several of which have been moved to a box labeled "UNNECESSARY." The room smells of burnt coffee and deadline panic. Anxiety did not do this out of malice. Every note, every plan, every sleepless detail was done out of a desperate, misguided love for Riley. That makes it worse.
mapsymbol: W
maplegend: War-Room
biome: dungeon
exits:
  south:
