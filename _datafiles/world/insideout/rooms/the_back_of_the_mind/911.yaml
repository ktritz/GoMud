roomid: 911
zone: The Back of the Mind
title: Control Override Station
description: A sleek, high-tech workstation built into an alcove, designed to remotely override the console in Headquarters. The terminal is still active, its screens displaying a real-time feed of Riley's emotional output alongside a series of sliders that can dampen or amplify each emotion independently. The interface is intuitive and terrifyingly powerful -- a few adjustments here could change how Riley feels about anything. Anxiety used this station to gradually dial down the emotions she deemed threats and crank up the ones she could control. The sliders for Joy and Sadness are pinned at zero. Anxiety's slider is maxed out. Someone has since pulled all the sliders to a neutral middle position, but the system is still live. The power here is real and uncomfortable.
mapsymbol: C
maplegend: Override
biome: dungeon
