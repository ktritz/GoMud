nouns:
  door: The <ansi fg="itemname">door</ansi> is a slab of brushed steel with no visible hinges, seams, or weak points. Its surface is perfectly smooth except for the keyhole, which is shaped like a tiny spiral -- the shape of an anxiety spiral, naturally. The locking mechanism makes a low, constant clicking sound, as if it is counting down to something or counting up from everything.
  panel: The <ansi fg="itemname">panel</ansi> displays a single red LED that blinks in a pattern suspiciously resembling a heartbeat. Below the light, embossed in tiny letters, are the words "SUPPRESSION SYSTEM ACTIVE. ALL UNAUTHORIZED EMOTIONS WILL BE CONTAINED FOR RILEY'S OWN GOOD." The word "good" has been scratched out and rewritten several times, each version less certain than the last.
idlemessages:
- The red light on the panel blinks faster for a moment, then returns to its steady rhythm.
- A muffled sound comes from beyond the door -- something between a cry and a whisper.
- The polished floor reflects a version of you that looks slightly more anxious than you feel.
- The locking mechanism clicks through a complex sequence, testing itself.
- The antiseptic smell intensifies, as if the corridor is trying to sterilize a feeling you just had.
