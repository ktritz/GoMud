roomid: 900
zone: The Back of the Mind
title: The Sealed Door
description: A featureless steel door stands at the end of a sterile white corridor, sealed with a complex locking mechanism that looks like it was designed by someone who really, really did not want anything getting out. The door has no handle on this side -- only a recessed keyhole and a small panel that displays a single blinking red light. The walls here are smooth and white, scrubbed clean of any personality or warmth, and the floor is polished to a mirror finish that reflects your face back at you with clinical detachment. The air is filtered and temperature-controlled, carrying the faint antiseptic smell of emotions that have been sanitized out of existence. Whatever Anxiety locked behind this door, she made very sure it would stay locked.
mapsymbol: D
maplegend: Door
