roomid: 906
zone: The Back of the Mind
title: Anxiety Spiral Nest
description: The clinical order of the Back of the Mind breaks down here, replaced by a chaotic tangle of spirals etched into every surface -- walls, floor, ceiling, even the air itself, where faint luminous trails loop and twist in patterns that make your eyes water if you try to follow them. This is where Anxiety's energy pooled and concentrated, spawning the spinning vortex creatures that patrol the vault. The floor is scarred with burn marks where spirals have touched down and spun themselves into frenzy, and the walls vibrate at a frequency that makes your thoughts race. Being here too long makes you think of every test you might fail, every text you should have sent, every future that could go wrong.
mapsymbol: '@'
maplegend: Spirals
biome: dungeon
exits:
  south:
