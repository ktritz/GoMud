idlemessages:
- A luminous spiral traces itself in the air, tightening until it sparks and vanishes.
- Your thoughts suddenly race -- did you leave something behind? Are you prepared for what comes next? The feeling passes.
- The walls vibrate at a frequency that makes your jaw clench involuntarily.
- Two spirals collide in midair and burst into a shower of anxious sparks.
- The burn marks on the floor glow brighter and you feel a pull toward the center of the room.
