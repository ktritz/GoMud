nouns:
  spirals: The <ansi fg="itemname">spirals</ansi> are burned into the surfaces like brands, each one a different size but all following the same tightening pattern -- wide loops that get smaller and faster until they reach a central point of frantic intensity. Touching one makes your mind race through a cascade of what-ifs that takes effort to stop.
  floor: The <ansi fg="itemname">floor</ansi> is covered in overlapping scorch marks where anxiety spirals have touched down. The marks form a chaotic map of worry -- each burn radiating outward in a pattern that gets tighter and more frantic toward the center. In the worst spots, the floor has been worn through entirely, revealing raw, humming metal beneath.
