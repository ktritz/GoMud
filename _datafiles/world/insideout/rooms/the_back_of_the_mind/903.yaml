roomid: 903
zone: The Back of the Mind
title: The Emotion Vault
description: 'The vault is a circular chamber of polished steel and reinforced glass, designed with a single, terrible purpose: to contain Riley''s emotions so completely that she cannot feel them. Five empty containment pods stand in a ring around the room, each one shaped to hold a specific emotion -- Joy, Sadness, Anger, Fear, Disgust. The pods are open now, their restraints dangling loose, but the scuff marks on the floor and the dents in the steel walls tell the story of what happened here. A central console controls the suppression field, its screens still displaying emotional readouts that flatline one by one. This is where Anxiety tried to protect Riley by removing everything that made her feel. The room hums with residual energy and a profound, clinical emptiness.'
