nouns:
  containment pods: The <ansi fg="itemname">containment pods</ansi> are transparent capsules sized for humanoid emotions. Joy's pod still has faint golden fingerprints on the inside of the glass where she pressed against it. Sadness's pod has a small puddle of blue at the bottom that never evaporates. Anger's pod is dented outward in several places. Fear's pod has scratch marks on the lock. Disgust's pod is the cleanest -- she refused to touch the walls.
  console: 'The central <ansi fg="itemname">console</ansi> is Anxiety''s masterwork -- a sprawling control system that monitored and suppressed Riley''s emotional output in real time. Screens display graphs of emotional intensity, all trending toward zero. One screen still reads "OPERATION: PROTECT RILEY. STATUS: ACTIVE." Beneath it, someone -- maybe Joy, maybe Sadness -- has scratched "This isn''t protection."'
idlemessages:
- A containment pod hums and its restraints twitch, as if remembering the emotion they held.
- The console beeps softly and an emotional readout flickers from flatline to a brief spike of blue.
- Golden fingerprints on Joy's pod glow faintly, then fade.
- The puddle of blue in Sadness's pod ripples, moved by a feeling too deep to suppress completely.
- The suppression field hums louder for a moment and your emotions feel muffled, then the hum fades.
