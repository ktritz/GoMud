roomid: 904
zone: The Back of the Mind
title: Echo Chamber
description: A domed chamber of curved, reflective walls that bounce sound endlessly between them, creating an acoustic trap for the emotional echoes that leak through Anxiety's suppression field. The room resonates with fragments of feelings -- half-words, interrupted laughs, the beginning of a cry that never finishes. The reflective surfaces are not quite mirrors; they show distorted versions of the room that are slightly more colorful, slightly more alive, as if the emotions trapped in the echoes are trying to rebuild themselves from sound alone. The effect is disorienting and deeply sad, like hearing a conversation through a wall and knowing you are missing something important.
mapsymbol: )
maplegend: Echo
biome: dungeon
