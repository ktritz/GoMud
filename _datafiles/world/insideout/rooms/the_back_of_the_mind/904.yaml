idlemessages:
- A fragment of Joy's laughter bounces off the walls, growing quieter with each reflection until it fades.
- The echo of someone crying loops three times, each repetition losing more of its emotion.
- A voice that sounds like Anger shouts something, but only the feeling of the words reaches you, not the meaning.
- The reflective walls briefly show a room full of color before snapping back to muted gray.
- An echo of Riley's voice says "I'm fine" and the room repeats it until the word "fine" sounds hollow.
