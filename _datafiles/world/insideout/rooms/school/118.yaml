title: School Roof Access
description: A concrete stairwell leads up from the courtyard to a heavy metal door marked "ROOF ACCESS -- AUTHORIZED PERSONNEL ONLY." The stairs are bare and utilitarian, the kind of space that exists purely to connect point A to point B with zero architectural ambition. Graffiti tags dot the walls, layered over years of paint, and the air gets cooler as you climb. Through a narrow window on the landing, you can see a sliver of sky and the tops of buildings stretching toward the bay. The door at the top is propped open with a brick -- someone has been up here recently. Beyond it, you can hear the wind and the distant hum of the city. It feels like standing at the edge of something.
