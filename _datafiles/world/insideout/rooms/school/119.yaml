nouns:
  mops: The <ansi fg="itemname">mops</ansi> are the industrial string variety, well-used and slightly damp. They lean against the wall in a cluster, their handles crossing like a tiny forest of cleaning implements. One of them has a strip of duct tape around the handle with "CARL'S -- DO NOT TOUCH" written on it.
  bucket: The wheeled <ansi fg="itemname">bucket</ansi> is bright yellow with a wringer attachment and a permanent ring of gray water at the bottom. It's the kind of bucket that has mopped every hallway in this school a thousand times. One wheel squeaks. It always squeaks.
  crack: The <ansi fg="itemname">crack</ansi> in the back wall runs from about knee height to just above your head, perfectly straight and slightly wider than a finger. Pressing close, you can feel warm air flowing through it, and the faint prismatic light on the other side shifts through colors that don't quite match anything in the visible spectrum. It smells like ozone and old memories. This isn't a crack in a wall -- it's a crack in something else entirely.
idlemessages:
- The crack in the wall pulses with a faint, shifting light -- gold, blue, purple.
- A mop handle slides against the wall and clatters to the floor.
- The air near the back wall hums at a frequency just below hearing, making your skin prickle.
- A cleaning supply bottle rattles on its shelf as something vibrates behind the wall.
- For just a moment, you hear distant music through the crack -- a melody that feels like a memory you can't quite place.
