roomid: 119
zone: School
title: Janitor's Closet
description: A tiny, cramped closet crammed with mops, a wheeled bucket, and enough cleaning supplies to sterilize a small hospital. Shelves on both walls hold bottles of industrial cleaner, rolls of paper towels, and a box of rubber gloves. The single bulb overhead casts a harsh yellow light that makes everything look slightly jaundiced. The space smells aggressively of pine cleaner and lemon floor polish. But there's something else in here -- in the back wall, partially hidden behind a mop rack, there's a crack in the plaster that shouldn't be there. It's too straight, too deliberate, and if you press your eye to it, you can see a faint prismatic light pulsing on the other side. The air near the crack hums with a frequency you feel in your teeth more than your ears.
