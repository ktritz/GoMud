nouns:
  lockers: The <ansi fg="itemname">lockers</ansi> are identical blue metal boxes, three high and stretching down the entire hallway. Some are personalized with stickers, photos taped inside the doors, and magnetic mirrors. A few have been decorated for someone's birthday with streamers and a sign. One locker near the middle is dented so badly it won't close all the way -- the victim of someone who got their exam grade back and expressed their feelings physically.
