idlemessages:
- A locker door swings open and a textbook tumbles out onto the floor.
- Two students bump into each other rounding the corner and mumble apologies without making eye contact.
- The clatter of a combination lock spinning echoes down the hall.
- A kid struggles with their locker for a solid ten seconds before it finally pops open.
- Someone shoves their entire backpack into a locker and forces it shut through sheer willpower.

