title: Locker Hallway North
description: A secondary hallway branches off from the main corridor, its walls lined with rows of blue lockers that stretch in both directions. The hall is narrower here, forcing students to squeeze past each other between classes in an awkward shuffle of backpacks and elbows. Combination locks dangle from most doors, and a few lockers stand slightly ajar, their contents -- textbooks, crumpled papers, a forgotten lunch bag -- visible through the gap. The overhead lights hum at a slightly different pitch than the main hallway, and the floor has a noticeable scuff trail from the constant foot traffic between the science wing and the music room.
