roomid: 107
zone: School
title: Gym
description: The gym is a vast echoing box of polished hardwood floors and impossibly high ceilings. A basketball court is painted on the main floor, its lines faded and repainted so many times you can see ghost outlines of previous layouts underneath. Wooden bleachers fold out from the far wall, and a championship banner from 2003 hangs from the rafters -- the most recent one, which the PE teacher mentions at least twice a week. The air smells permanently like rubber and floor polish, and every sound bounces around the space in an endless echo. A Coach's whistle blast cuts through the noise at regular intervals, sharp enough to make your fillings vibrate.
