roomid: 101
zone: School
title: Main Hallway
description: A long corridor stretches under buzzing fluorescent lights, its linoleum floor scuffed by a decade of sneakers. Rows of dented lockers line both walls in the school's blue and gold colors, most of them decorated with stickers and sharpie doodles from previous owners. A big glass trophy case stands against one wall, displaying dusty trophies, team photos, and a hand-lettered sign that reads "FOGHORN PRIDE." Classroom doors branch off in both directions, and the hallway carries the permanent smell of floor wax and whatever the cafeteria is cooking. This is the central artery of the school -- everything connects through here.
