roomid: 106
zone: School
title: Cafeteria
description: The cafeteria is a cavernous room of long tables with attached benches, the kind you have to swing your legs over to sit down. The lunch line snakes along the far wall past a sneeze guard and a series of warming trays that hold today's questionable offerings. A vending machine hums in the corner, its glass front displaying chips, candy bars, and a granola bar that's been stuck on the top row since September. The menu board above the serving counter lists today's options in removable letters, though someone has rearranged a few to spell something inappropriate that the lunch staff hasn't noticed yet. The noise level in here is a wall of sound -- laughter, arguments about nothing, and the constant clatter of plastic trays.
