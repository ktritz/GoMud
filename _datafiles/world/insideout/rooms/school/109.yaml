roomid: 109
zone: School
title: Library
description: The school library is a surprisingly peaceful island in the chaos of the hallways. Tall rows of bookshelves divide the room into quiet aisles, their shelves packed with everything from dog-eared paperbacks to reference encyclopedias that nobody has opened since the internet was invented. A cluster of computers sits on a long desk near the entrance, all of them displaying the school's homepage with a filter that blocks approximately everything interesting. A cozy reading nook with beanbag chairs is tucked into the far corner, perpetually claimed by the same three kids. The librarian's desk is a fortress of returned books, overdue notices, and a mug that says "Shhh... I'm reading." The carpet is that weird institutional blue-gray that absorbs all sound and most of your will to leave.
