nouns:
  lockers: These <ansi fg="itemname">lockers</ansi> are marginally nicer than the ones in the north hallway -- fewer dents, less graffiti, and the paint is only chipping in a few places. The replacement lockers have slightly different handles, which drives the custodial staff crazy for reasons nobody else understands.
  bulletin board: The <ansi fg="itemname">bulletin board</ansi> is a layered archaeology of school announcements. Peel back the top layer and you'll find sign-up sheets from three semesters ago. Current postings include Drama Club auditions, a Mathletes recruitment flyer with zero names on it, and someone selling a "slightly used" graphing calculator. A hand-drawn flyer for the school dance has hearts on it and the theme "ENCHANTED EVENING" which someone has edited to "ENCHANTED EVENING (of awkward slow dancing)."
idlemessages:
- A student speed-walks past, clearly late for something.
- The courtyard door opens and a gust of cool bay air sweeps through the hall.
- A flyer peels off the bulletin board and drifts to the floor.
- Someone tests their locker combination three times before realizing they're at the wrong locker.
