title: Locker Hallway South
description: The south end of the locker hallway is quieter than its northern counterpart, tucked away from the main flow of student traffic. More lockers line the walls here, these ones slightly newer -- replaced after a water pipe burst a few years back. A bulletin board on one wall is pinned with club sign-up sheets, a lost-and-found flyer for someone's retainer (with a photo, unfortunately), and a poster for the upcoming school dance. The hallway connects to the administrative wing to the east and opens out toward the courtyard to the west. A faded "EXIT" sign glows above the courtyard door.
