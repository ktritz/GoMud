title: Classroom 101 - English
description: Ms. Parker's English classroom is the kind of room where the walls do most of the teaching. Posters about literary devices, famous authors, and the importance of the Oxford comma compete for space with student work pinned up on a corkboard. Rows of desks face a large whiteboard covered in today's vocabulary words and a quote of the week -- something by Maya Angelou that half the class copied into their notebooks and the other half photographed with their phones. A worn copy of "To Kill a Mockingbird" sits on the edge of the teacher's desk, bristling with sticky tabs.
