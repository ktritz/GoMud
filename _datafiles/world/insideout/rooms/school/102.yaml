nouns:
  whiteboard: The <ansi fg="itemname">whiteboard</ansi> is divided into sections with careful dry-erase borders. Today's vocab includes "ephemeral," "juxtaposition," and "ennui" -- that last one underlined twice. A corner of the board reads "ESSAY DUE FRIDAY -- NO EXCUSES" in red marker. Below it, someone has faintly written "what if my dog ate it" in pencil.
  desks: The <ansi fg="itemname">desks</ansi> are the standard one-piece chair-and-desk combos that are comfortable for approximately zero human body types. Most have initials or tiny drawings carved into the surface by generations of bored students. One desk in the back has "I WAS HERE" scratched into it, which is technically a complete sentence.
  posters: The <ansi fg="itemname">posters</ansi> are a mix of inspirational and educational. "READ OR DIE" features a dramatic illustration of a dragon made of books. A Shakespearean insult chart hangs near the door. One poster just says "WORDS MATTER" in forty different fonts, which kind of proves its own point.
