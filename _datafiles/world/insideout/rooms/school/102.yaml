idlemessages:
- A pencil rolls off a desk and clatters to the floor in the silence.
- The whiteboard marker squeaks as someone adds to the vocabulary list.
- A page turns somewhere in the room -- someone actually doing the reading.
- The clock on the wall ticks loudly, each second stretching longer than the last.
