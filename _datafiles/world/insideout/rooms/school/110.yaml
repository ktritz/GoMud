title: Principal's Office
description: The principal's office radiates the specific energy of a room you never want to be called into. A heavy wooden desk dominates the space, impeccably organized with a pen cup, a lamp, and a nameplate that reads "PRINCIPAL VASQUEZ." Motivational posters line the walls -- "INTEGRITY IS DOING THE RIGHT THING WHEN NOBODY IS WATCHING" and "EVERY DAY IS A CHANCE TO BE BETTER" -- the kind that feel encouraging or threatening depending on why you're here. Two uncomfortable chairs face the desk for students who are definitely in trouble. A framed diploma from Stanford hangs on the wall next to photos of every graduating class going back fifteen years.
