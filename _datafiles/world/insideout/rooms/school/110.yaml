nouns:
  desk: Principal Vasquez's <ansi fg="itemname">desk</ansi> is the cleanest surface in the entire school. Everything is squared off and organized with military precision. A small cactus sits in the corner of the desk -- the only personal touch. A manila folder labeled "DISCIPLINARY ACTIONS - CURRENT" sits in the center, thick enough to be concerning.
  nameplate: The <ansi fg="itemname">nameplate</ansi> reads "PRINCIPAL R. VASQUEZ" in engraved brass letters on dark wood. It's positioned perfectly at the front of the desk, angled to be readable from the student chairs. There's something about seeing your name carved in brass that says "I am not messing around."
  posters: The <ansi fg="itemname">motivational posters</ansi> are the standard-issue inspirational variety, but someone -- presumably Vasquez -- has added handwritten notes to a few of them. "BELIEVE IN YOURSELF" has "and also study for your tests" written below it in neat cursive. "TEAMWORK MAKES THE DREAM WORK" has "but individual accountability makes the grade" added underneath.
idlemessages:
- The desk chair swivels slightly, as if Principal Vasquez just stepped out.
- A phone on the desk rings twice and then goes silent.
- The motivational posters stare down at you with aggressive encouragement.
- A pen rolls slowly across the desk and stops at the exact edge without falling.
