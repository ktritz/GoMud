roomid: 115
zone: School
title: Teacher's Lounge
description: The mythical teacher's lounge, forbidden territory for students and therefore the most interesting room in the school. A coffee machine dominates the counter, surrounded by a graveyard of mismatched mugs and a bowl of creamer packets. Comfortable but aging chairs are arranged around a low table covered in newspapers, crossword puzzles, and someone's abandoned lunch container from three days ago. A bulletin board on the wall holds staff memos, a sign-up sheet for potluck Friday, and a passive-aggressive note about labeling your food in the fridge. The vibe in here is "exhausted adults pretending to recharge in twenty-two minutes."
mapsymbol: T
maplegend: Teachers
