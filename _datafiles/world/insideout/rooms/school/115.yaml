nouns:
  coffee machine: The <ansi fg="itemname">coffee machine</ansi> is the most important object in the entire school, at least according to the faculty. It's an industrial-grade brewer that runs approximately sixteen hours a day. The coffee it produces is strong enough to strip paint, and the teachers drink it like water. A handwritten label on the pot reads "DECAF IS FOR QUITTERS." Someone has added "and people who want to sleep, Karen" underneath.
  bulletin board: 'The staff <ansi fg="itemname">bulletin board</ansi> is a window into the hidden world of teacher politics. Meeting schedules, professional development reminders, and a sign-up sheet for "WELLNESS WEDNESDAY (mandatory fun)" are pinned alongside a passive-aggressive note that reads "To whoever keeps taking my yogurt from the fridge: I know who you are. -- G.P." Below it, someone has pinned a response: "Prove it."'
idlemessages:
- The coffee machine gurgles and dispenses another cup of liquid determination.
- Muffled conversation drifts from behind a newspaper -- teachers talking about students, probably.
- Someone sighs the deep, existential sigh of a person grading essays on a Friday.
- A phone alarm goes off and a teacher mutters "already?" before standing up reluctantly.
- The microwave beeps three times and nobody gets up to check it.
