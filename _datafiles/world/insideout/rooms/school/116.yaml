title: Courtyard
description: The school courtyard is a square of open air surrounded by building walls on three sides, with a row of picnic tables scattered across a concrete pad. A single tree grows from a square of dirt in the center, stubbornly alive despite decades of students carving their initials into its bark. A small fountain sits near the far wall, its basin usually half-full of pennies and the occasional homework assignment that blew in on the wind. This is where people come to eat lunch outside, gossip between classes, and have the kind of conversations that feel world-ending at fifteen and irrelevant by sixteen. The bay breeze funnels through the courtyard in unpredictable gusts, scattering napkins and flipping textbook pages.
