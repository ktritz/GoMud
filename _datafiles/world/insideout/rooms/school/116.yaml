nouns:
  tree: The <ansi fg="itemname">tree</ansi> is a coast live oak that's been growing here since before the school was built. Its trunk is covered in carved initials, hearts, and at least three class years. The branches spread wide enough to shade two of the picnic tables, and someone has tied a friendship bracelet to one of the lower limbs. It's the unofficial social center of the courtyard.
  tables: The picnic <ansi fg="itemname">tables</ansi> are weathered wood bolted to the concrete, each one a palimpsest of Sharpie tags, carved names, and sticker residue. Some kids eat lunch here, some do homework, and some just sit in small groups talking about nothing and everything. The table closest to the tree is prime real estate.
  fountain: The <ansi fg="itemname">fountain</ansi> is a modest concrete basin with a trickle of water running from a pipe in the center. The water is clear but the bottom is paved with pennies -- wishes from years of students hoping for good grades, first kisses, and snow days that never come in San Francisco. A few nickels suggest someone wished extra hard.
idlemessages:
- A gust of wind sweeps through the courtyard and sends a napkin spiraling into the air.
- Two kids sit under the tree, sharing earbuds and nodding along to the same song.
- A squirrel runs along the top of the courtyard wall, pauses, and judges everyone below.
- Someone tosses a penny into the fountain and closes their eyes for a moment.
- The wind carries the muffled sound of a bell ringing inside the school.
