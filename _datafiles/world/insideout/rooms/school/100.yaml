title: School Front Entrance
description: Wide concrete steps lead up to a pair of heavy glass double doors plastered with spirit week flyers and a faded "GO FOGHORNS!" banner. A row of bike racks lines the sidewalk to the left, most of them claimed by a tangle of locks and cables. The school name is etched into a stone plaque above the entrance, and a flagpole out front snaps a California state flag in the bay breeze. Kids stream in and out between bells, backpacks slung over one shoulder, earbuds in, eyes on their phones. The whole building has that institutional beige look that says "built in the nineties, renovated never."
