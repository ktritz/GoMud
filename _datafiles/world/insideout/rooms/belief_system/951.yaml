zone: Belief System
title: The Foundation
description: 'Solid ground stretches beneath your feet -- not stone or metal, but something that feels like certainty made physical. The floor is a deep, warm amber, smooth and unyielding, and inscriptions are carved directly into its surface: Riley''s oldest, most fundamental beliefs, the ones that everything else stands on. "I am loved." "I am safe." "I belong." They glow with a soft, steady light that has never once flickered. Pillars rise from the foundation at regular intervals, each one carved from a different emotional crystal, supporting the vast chamber above. The ceiling is lost in a gentle golden haze. This place feels ancient -- not in years, but in certainty. These beliefs were here before Riley could speak, and they''ve held firm ever since.'
