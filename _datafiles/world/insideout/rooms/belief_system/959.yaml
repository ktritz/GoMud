zone: Belief System
title: Identity Island - Honesty
description: Everything here is transparent. The ground beneath your feet is crystal -- clear, flawless, hiding nothing. The structures on this island are built from glass-like material that lets you see through walls, through floors, through everything. There are no hidden rooms, no locked doors, no secrets. A central pillar of pure white light rises from the island's core, representing the belief that truth matters even when it's hard. Inscriptions in the crystal record moments when Riley chose honesty over comfort -- telling the truth about breaking a vase, admitting she was struggling at school, saying how she really felt instead of pretending everything was fine. The island hums with the clean, clear frequency of a mind that values authenticity.
mapsymbol: T
maplegend: Honesty
