nouns:
  crystal: 'The <ansi fg="itemname">crystal</ansi> ground is mesmerizing. Through it, you can see the island''s internal structure -- layers of honest moments stacked like geological strata, each one adding strength. The oldest layers, from early childhood, are simple: "I did it. I''m sorry." The newer ones are more complex, more nuanced, more brave.'
  pillar: The central <ansi fg="itemname">pillar</ansi> of light is honesty in its purest form -- the belief that being truthful is part of who Riley is, even when the truth is inconvenient or scary. It doesn't waver or flicker. It simply is, steady and constant, the backbone of integrity.
  inscriptions: The <ansi fg="itemname">inscriptions</ansi> in the crystal are a record of courageous truth-telling. "I told Mom I was homesick." "I admitted I needed help with math." "I said sorry and meant it." Each one was hard in the moment and strengthened the island afterward. The newest inscription is still being carved -- honesty is always in progress.
idlemessages:
- The crystal ground brightens as a truth is acknowledged somewhere in Riley's mind.
- The central pillar pulses once, clean and white, a heartbeat of integrity.
- An inscription deepens in the crystal, reinforced by a moment of difficult honesty.
- The transparent walls reflect nothing -- they have nothing to hide, and neither does Riley.
- A clear tone rings across the island, the sound of a truth spoken plainly.
