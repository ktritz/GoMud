title: Belief System Gateway
description: 'A soaring archway of braided light marks the entrance to Riley''s Belief System. The arch is woven from strands of every emotional color -- gold, blue, red, green, purple, and the newer shades that arrived with puberty: orange anxiety, pink embarrassment, teal ennui. Beyond the threshold, the air shimmers with a warmth that feels deeply personal, like the inside of a thought you''ve had about yourself a thousand times. Inscriptions run along both sides of the archway, fragments of beliefs both old and new, layered over each other like graffiti on a bridge. This is where Riley''s sense of self begins -- the bedrock on which everything else is built.'
mapsymbol: G
maplegend: Gateway
