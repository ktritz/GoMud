title: Positive Belief Corridor
description: 'A wide, luminous hallway stretches forward, its walls aglow with inscriptions that radiate warmth and light. Every surface carries one of Riley''s positive beliefs about herself, carved in letters that pulse with emotional color and throw patterns across the polished floor like stained glass. The air in here feels lighter, easier to breathe, charged with the quiet confidence of someone who has started to figure out who they are. Memory fragments float in alcoves along the walls -- tiny scenes that prove each belief true: a goal scored, a friend defended, a hard truth spoken. The corridor hums with the collected evidence of Riley''s best self.'
mapsymbol: +
maplegend: Positive
biome: mindscape
