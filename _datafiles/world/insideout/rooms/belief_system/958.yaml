nouns:
  pathways: The <ansi fg="itemname">pathways</ansi> are a map of Riley's social world. The widest path leads to her best friend's platform, bright and warm and practically glowing with daily use. Other paths branch to teammates, school friends, and the people she hasn't talked to in a while but still thinks about. A few paths from Minnesota are thin and fading, but none have disappeared entirely. Riley doesn't forget people.
  boards: The <ansi fg="itemname">message boards</ansi> are covered in the language of friendship. Inside jokes that would make no sense to anyone else. Screenshots of ridiculous group chat moments. A drawing of a stick figure labeled "us" doing something absurd. One board just has "remember that time--" written fifty different ways, because shared memories are the currency of connection.
  laughter: The <ansi fg="itemname">laughter</ansi> that fills this island isn't a sound so much as a feeling. It's the specific physical sensation of laughing with someone who gets you -- the ache in your stomach, the tears in your eyes, the helpless feeling of not being able to stop. It comes in waves, each one from a different friendship, a different moment.
idlemessages:
- A burst of laughter rings across the island, the memory of a joke that still lands.
- A friendship bracelet bridge brightens as Riley thinks about a friend.
- A pathway widens slightly -- a friendship growing stronger with every interaction.
- The message boards update with a new inside joke. Nobody else would understand it.
- A thin path from Minnesota glows briefly. Old friends aren't forgotten, just far away.
