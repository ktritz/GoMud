title: Identity Island - Friendship
description: This island buzzes with energy and connection. Crisscrossing pathways link dozens of small platforms, each one representing a friendship or connection Riley has built. Some paths are wide and well-worn -- the close friends she talks to every day. Others are thinner, older, connecting to platforms from Minnesota that still glow faintly. Message boards covered in inside jokes, shared memes, and remembered conversations stand at every intersection. The air is full of laughter -- not recorded, but the remembered feeling of laughing so hard your stomach hurts. Friendship bracelets the size of bridges connect the largest platforms, their beads spelling out names and inside jokes.
