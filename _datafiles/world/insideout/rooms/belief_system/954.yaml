nouns:
  mirror: The great <ansi fg="itemname">mirror</ansi> is Riley's self-image in real-time. Right now the reflection shifts between confident and uncertain every few seconds, as if the mirror can't decide which version is more accurate. The confident Riley stands straight, eyes bright, radiating competence. The uncertain one looks smaller, as if trying to take up less space. Both are true. That's the hard part.
  mirrors: The smaller <ansi fg="itemname">mirrors</ansi> show Riley through others' eyes. The "Friends" mirror shows someone funny, reliable, a little weird in a good way. The "Parents" mirror shows someone still young enough to protect but old enough to respect. The "Strangers" mirror is the cruelest -- it shows what Riley imagines others think, which is almost certainly worse than reality.
  crystal: 'The rotating <ansi fg="itemname">crystal</ansi> at the center of the room is trying to solve an impossible problem: combining every version of how Riley is perceived into a single, coherent self-image. It spins and refracts light in conflicting directions, and occasionally it stutters, caught between two versions that can''t both be true. It will probably never stop spinning. That''s okay. That''s what growing up looks like.'
idlemessages:
- The great mirror flickers between confident and uncertain, searching for which Riley is real.
- A smaller mirror labeled "How Classmates See You" adjusts its image after a social interaction.
- The central crystal stutters and sends a prism of fractured light across every surface.
- The reflection in the floor and the reflection in the mirror disagree for a moment, then align.
- The "Parents" mirror glows warm and steady. Some reflections are easier to trust than others.
