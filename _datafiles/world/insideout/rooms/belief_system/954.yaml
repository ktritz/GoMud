roomid: 954
zone: Belief System
title: The Self-Image Chamber
description: 'A circular room dominated by an enormous mirror that stretches from floor to ceiling, filling the entire far wall. But this isn''t a normal mirror -- it reflects not how Riley looks, but how she sees herself, and the image shifts constantly. One moment the reflection stands tall, confident, surrounded by golden light. The next it shrinks, shoulders hunched, the light turning gray and uncertain. Smaller mirrors ring the room at various angles, each one showing a different version: Riley as her friends see her, Riley as her parents see her, Riley as she fears strangers see her. The floor is polished to a reflective sheen, creating the disorienting sense of being surrounded by selves on every side. At the center of the room, a slowly rotating crystal projects all the reflections at once, trying to reconcile them into a single truth.'
mapsymbol: M
maplegend: Mirror
biome: mindscape
