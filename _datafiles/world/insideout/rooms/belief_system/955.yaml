roomid: 955
zone: Belief System
title: Confidence Bridge
description: A long, narrow bridge spans a dizzying gap between the inner Belief System and the Personality Islands beyond. The bridge is made of translucent material that glows gold when you step on it with certainty and dims to gray when doubt creeps in. The surface is solid -- mostly -- but it sways with every step, and looking down reveals a churning void of unresolved feelings far below. Halfway across, the railing bears deep scratches where someone gripped it during a crisis of confidence. The bridge connects to both the positive and negative corridors behind you and stretches forward toward the Personality Islands ahead. It is, in every sense, the path between who Riley believes she is and who she shows the world.
mapsymbol: '='
maplegend: Bridge
biome: mindscape
exits:
  west:
