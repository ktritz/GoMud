title: Sense of Self Core
description: 'At the very heart of Riley''s Belief System, past every corridor of doubt and conviction, past the forge and the toxic pool, lies this: a quiet, luminous chamber where Riley''s truest sense of self resides. A single thread of braided light hangs suspended in the center of the room, woven from every color, every emotion, every experience that makes Riley who she is. It''s not large -- it''s about the size of a person -- and it pulses with a rhythm that matches Riley''s heartbeat exactly. The walls of the chamber are smooth and dark, like the inside of a geode, studded with tiny points of light that are individual memories -- not the big ones, but the small, defining moments that collectively answer the question "Who am I?" The room is warm. The room is safe. The room is her.'
mapsymbol: '@'
maplegend: Core
biome: mindscape
