title: Identity Island - Hockey
description: The bridge gives way to solid ground, and suddenly you're standing on a miniature world built entirely from Riley's love of hockey. A gleaming ice rink dominates the center, its surface perpetually frozen and smooth, etched with the marks of a thousand practice sessions. The boards are covered in team photos and pennants from every team Riley has played on -- the Prairie Dogs back in Minnesota and her current San Francisco team. The air is crisp and cold and smells like fresh ice and rubber puck. Sticks lean against every surface and a scoreboard overhead reads HOME in bright letters, because this part of Riley's identity has always felt like coming home.
