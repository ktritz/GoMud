nouns:
  scaffolding: The <ansi fg="itemname">scaffolding</ansi> is fascinating -- an island actively under construction. New platforms extend outward as Riley discovers new music. A section labeled "INDIE ROCK" was just added last week, still bright with fresh energy. An older section, "CHILDHOOD SONGS," is smaller but deeply rooted, its foundations sunk into the island's core. The whole structure grows a little every day.
  speakers: The <ansi fg="itemname">speakers</ansi> are works of art -- chrome and crystal, each one tuned to a genre that's part of Riley's musical identity. One plays the pop songs she blasts in her room. Another plays the folk music Dad always had on in the car. A tiny speaker near the ground plays a lullaby Mom used to sing, barely audible but impossibly strong.
  stage: The <ansi fg="itemname">stage</ansi> is where Riley's musical identity performs for an audience of one. Instruments play themselves in shifting arrangements, sometimes perfectly in sync, sometimes clashing experimentally. A microphone stands at center stage, humming with potential. The stage is still finding its sound, and that's what makes it exciting.
idlemessages:
- A speaker erupts with a guitar riff that Riley just heard for the first time today.
- The stage instruments shift into a new arrangement, trying on a style Riley hasn't explored yet.
- The scaffolding extends another few feet as a new song becomes a new favorite.
- Bass vibrates through the island's foundation, a heartbeat of newly discovered passion.
- A melody from childhood weaves through a newer song, connecting who Riley was to who she's becoming.
