roomid: 319
zone: Long Term Memory
title: Emotional Tag Station
description: A specialized workstation hidden deep in the shelves, equipped with delicate machinery designed to retag the emotional color of memory orbs. A rotating platform holds an orb in a cradle of light while adjustable lenses filter different emotional wavelengths through it, allowing a skilled operator to shift a memory's dominant emotion. What was once a purely sad memory can gain a golden edge of gratitude. An angry memory can cool into something more like determination. The controls are intricate and clearly require expertise. A sign above the station reads "EMOTIONAL RECATEGORIZATION -- Handle With Care. A memory's color is not just what you felt, but what you learned."
