nouns:
  bridge: The <ansi fg="itemname">bridge</ansi> is a marvel of subconscious engineering. Its surface ripples with color when you step on it, and the railings are warm to the touch, as if made from solidified joy. Looking over the edge reveals clouds of creative energy drifting in the space between regions of the mind. Occasionally a half-formed idea floats past -- a castle, a dinosaur, a song that does not exist yet.
idlemessages:
- The bridge surface ripples with rainbow light under your feet.
- A cloud of creative energy drifts past below, briefly taking the shape of a dragon before dissolving.
- The colors of Imagination Land ahead shift and swirl like a living painting.
- A warm breeze carries the faint sound of laughter and the smell of crayons from across the bridge.
- The shelves of Long Term Memory behind you glow quietly, a vast library of everything that ever was.
