roomid: 317
zone: Long Term Memory
title: Mind Worker Patrol Route
description: A long, straight corridor between the shelves that serves as the main patrol route for the mind workers assigned to the deep sections. Safety lamps are bolted to the shelves at regular intervals, casting pools of warm orange light that push back the gloom. Painted arrows on the floor mark the patrol path, and a series of checkpoint stations line the route, each one a small podium with a logbook and a bell. The shelves along this corridor are better maintained than the surrounding areas -- the mind workers take their patrol duties seriously, even if the things they are guarding against prefer to stay in the dark.
mapsymbol: M
maplegend: Patrol
biome: mindscape
