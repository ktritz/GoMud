nouns:
  lamps: The safety <ansi fg="itemname">lamps</ansi> are heavy-duty fixtures bolted directly into the shelf frames. They run on some kind of mental energy and never seem to burn out, though they flicker occasionally when something passes through the shadows between them. Each one has a small plaque reading "PROPERTY OF MIND WORKER LOCAL 107."
  stations: 'The checkpoint <ansi fg="itemname">stations</ansi> are simple podiums with logbooks chained to them. The entries are meticulous: "0300 -- All clear. Shelf 7,892 stable." "0315 -- Heard scratching in Section F. Investigated. Found nothing. Unsettling." "0330 -- Still thinking about the scratching."'
idlemessages:
- A distant bell rings at a checkpoint station deeper in the corridor.
- Footsteps echo from around a corner -- a mind worker on their rounds.
- One of the safety lamps flickers and a shadow darts between the shelves.
- A logbook page turns in a draft, revealing an entry that just says "NOPE" in large letters.
- The painted arrows on the floor glow faintly, guiding the way forward.
