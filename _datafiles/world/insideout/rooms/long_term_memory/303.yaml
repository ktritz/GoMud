nouns:
  anger memories: The <ansi fg="itemname">anger memories</ansi> are hot to the touch. One shows a slammed door. Another captures the white-hot moment of being accused of something you did not do. A third replays an argument on loop, each repetition making the orb glow brighter. The containment brackets on the most intense ones are slightly warped from the heat.
idlemessages:
- A red orb flares violently, casting sharp shadows that jump across the walls.
- The temperature spikes and you feel a sudden urge to clench your fists.
- Something inside a nearby orb makes a sound like a door slamming.
- The reinforced shelves creak under the strain of particularly furious memories.
- A faint smell of smoke drifts from the deeper sections of the corridor.
