roomid: 303
zone: Long Term Memory
title: Red Memory Corridor
description: The temperature climbs sharply as you enter the red memory corridor. The anger memories packed into these shelves burn with a fierce, ruddy glow that makes the walls look like they are lit by an underground furnace. Some orbs pulse erratically, as if the fury inside them is still simmering years later. The air is dry and warm, carrying a faint smell of scorched metal. The shelves here are reinforced with extra bracing, and a few orbs sit in special containment brackets -- memories so intense they might roll right off the shelf without them. You can almost hear teeth grinding.
mapsymbol: R
maplegend: Red
biome: mindscape
