nouns:
  orbs: The childhood <ansi fg="itemname">orbs</ansi> are beautiful in their simplicity. One shows a pair of tiny hands finger-painting. Another captures the moment of learning to ride a bicycle, the world tilting wildly. A third replays a bedtime story, the parent's voice warm and close. They glow with the pure, uncomplicated light of a time before things got complicated.
idlemessages:
- A golden orb plays a scene of a toddler laughing at a funny face, and you feel inexplicably warm.
- The shelves here smell faintly of crayons and sunscreen.
- A memory of a lullaby drifts from a nearby orb, barely audible but deeply familiar.
- The warm golden light flickers and for a moment you are five years old again.
- Dust motes float through the amber light like tiny, lazy fireflies.
