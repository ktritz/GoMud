roomid: 313
zone: Long Term Memory
title: Childhood Memory Wing
description: 'The shelves here hold some of the oldest memories in Long Term storage, and they glow with a warm, nostalgic golden light that is softer and gentler than the sharp yellow of the joy corridor. The orbs are slightly larger than modern ones -- childhood memories take up more space, apparently, because everything felt bigger back then. Many show simple scenes: a sandbox, a sprinkler on a summer lawn, the interior of a blanket fort. The shelves are lower here, as if built for smaller hands, and the air carries the faint sweetness of juice boxes and Play-Doh. It is impossible to walk through this wing without feeling a gentle ache for something you cannot quite name.'
mapsymbol: C
maplegend: Childhood
