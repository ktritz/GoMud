roomid: 311
zone: Long Term Memory
title: Triple Dent Gum Alley
description: The instant you step into this alley between the shelves, it hits you -- the jingle. That catchy, inescapable, maddeningly repetitive Triple Dent Gum jingle, playing from an orb somewhere in these shelves on an infinite loop. The mind workers have tried everything to stop it. They have moved the orb. They have buried it under other orbs. They have filed formal complaints. Nothing works. The jingle persists. The walls of this narrow passage are plastered with faded Triple Dent Gum wrappers and someone has scratched "MAKE IT STOP" into the shelf frame. The orbs nearby have taken on a pinkish tint, as if even the neighboring memories have been infected.
mapsymbol: T
maplegend: Gum
biome: mindscape
exits:
  north:
