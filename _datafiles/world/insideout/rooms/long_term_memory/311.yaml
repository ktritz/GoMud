nouns:
  jingle: 'The <ansi fg="itemname">jingle</ansi> is coming from a single, innocuous- looking pink orb wedged into a middle shelf. Inside it, a commercial plays on an eternal loop: smiling people chewing gum, a catchy tune, and the words "Triple Dent Gum will make you smile!" It is the catchiest thing you have ever heard and you already know it will be stuck in your head for days.'
  wrappers: Faded Triple Dent Gum wrappers are stuck to the walls, shelves, and floor of this alley. They seem to multiply when you are not looking. Each one features the same grinning mascot and the slogan "You'll Never Forget The Taste!" which, given the location, is unfortunately accurate.
idlemessages:
- Triple Dent Gum, it makes you smile! Triple Dent Gum, it lasts a while!
- The jingle restarts from the beginning. It never actually stopped.
- A mind worker hurries through the alley with their hands over their ears.
- Triple Dent Gum! Triple Dent Gum! Triple Dent Gum!
- You catch yourself humming along and feel a deep sense of betrayal by your own brain.
