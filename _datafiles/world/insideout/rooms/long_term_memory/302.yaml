nouns:
  sadness memories: The <ansi fg="itemname">sadness memories</ansi> shimmer with a quiet depth. One shows a rainy car ride with no conversation. Another captures the moment of realizing a friendship has drifted apart. They are painful to look at but impossible to look away from. Each one feels important in a way that is hard to articulate.
idlemessages:
- A blue orb dims slightly and you feel an unexpected pang of nostalgia.
- The sound of quiet rainfall leaks from a cluster of orbs on a high shelf.
- A tear-shaped drop of light falls from a memory orb and evaporates before it hits the floor.
- The corridor sighs -- or perhaps that is just the air shifting between the shelves.
- A faint melody drifts past, the kind of sad song you cannot stop listening to.
