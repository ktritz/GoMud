roomid: 302
zone: Long Term Memory
title: Blue Memory Corridor
description: The warmth of the yellow corridor fades behind you as a deep, cool blue light washes over everything. The sadness memories lining these shelves glow in shades of cerulean, cobalt, and midnight blue, casting long, gentle shadows that pool on the floor like still water. The air is noticeably cooler here and carries a faint dampness, as though the memories themselves are quietly weeping. Despite the melancholy, there is a strange beauty to this place -- the blue light is soft and kind, and the silence feels less empty than it does contemplative.
mapsymbol: B
maplegend: Blue
biome: mindscape
