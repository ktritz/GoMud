zone: Long Term Memory
title: Green Memory Corridor
description: A sharp, discerning green light fills this corridor, cast by the disgust memories that line the shelves in neat, almost prissy rows. Unlike the other corridors, these orbs are arranged with unusual precision -- sorted by intensity, subcategory, and what appears to be a personal rating system using tiny sticker labels. The green light has an acerbic quality, making everything look slightly overexposed and unforgiving. The air smells faintly of broccoli and moral superiority. A passage continues south toward the Mind Worker Break Room.
