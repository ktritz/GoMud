nouns:
  labels: The <ansi fg="itemname">labels</ansi> are a mess. Someone has tried to recategorize this section multiple times, each attempt layered over the last. "BIRTHDAY PARTIES" is crossed out and relabeled "TUESDAYS" which is crossed out and relabeled "THINGS WITH FROSTING." The organizational logic has completely collapsed.
idlemessages:
- You turn a corner and find yourself back where you were a moment ago. Or were you?
- Two orbs on adjacent shelves glow the same scene from different perspectives.
- A label peels off a shelf and drifts to the floor, revealing three more labels underneath.
- The corridor ahead bends in a direction that should not exist.
- You hear your own footsteps echoing from somewhere you have not walked yet.
