roomid: 315
zone: Long Term Memory
title: Twisted Memory Path
description: The orderly grid of shelves breaks down here, the passages twisting and doubling back on themselves in ways that defy the logic of any filing system. Shelves lean at odd angles, some fused together where memories have cross-contaminated, creating dead ends and loops that bring you back to where you started. The labels on the shelves are smeared and contradictory -- "SCHOOL" next to "VACATION" next to "THAT DREAM ABOUT SCHOOL ON VACATION." The light shifts unpredictably between colors as you walk past orbs from every emotional category jammed together in confused clusters. It is easy to get lost here. Many have.
