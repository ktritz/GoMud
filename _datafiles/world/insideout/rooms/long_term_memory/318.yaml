roomid: 318
zone: Long Term Memory
title: Crumbling Memory Wall
description: A massive section of the shelf structure has partially collapsed here, creating a wall of broken shelving, scattered orbs, and cascading gray dust that shifts and settles with every vibration. The collapse has exposed the raw infrastructure of Long Term Memory -- support beams of crystallized thought, conduits that once carried emotional energy, and the hollow spaces where memories were never stored at all. The remaining shelves creak and groan ominously, and small avalanches of dust trickle down at irregular intervals. Picking through the rubble, you can see a passage continuing south beyond the worst of the damage.
