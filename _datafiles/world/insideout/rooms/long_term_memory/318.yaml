nouns:
  dust: The <ansi fg="itemname">dust</ansi> here is a mix of crumbled shelf material and pulverized memory orbs. It shifts and slides like dry sand, and occasionally a shard of an orb surfaces, playing a half-second fragment of a scene before going dark. Walking through it feels like wading through the detritus of a thousand forgotten Tuesdays.
  beams: The exposed support beams are made of something that looks like crystal but feels like solidified thought. They hum faintly when touched, and light travels through them in slow pulses -- the structural nervous system of Long Term Memory itself.
idlemessages:
- A section of shelf groans and drops another inch, sending a cascade of dust to the floor.
- An orb fragment surfaces in the rubble, plays a single note of music, and goes dark.
- The support beams hum louder for a moment, then settle back to their baseline frequency.
- A crack spider-webs across a leaning shelf with a sound like breaking ice.
- Dust pours from a gap in the wall in a steady stream, like an hourglass counting down.
