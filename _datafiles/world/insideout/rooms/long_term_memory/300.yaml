roomid: 300
zone: Long Term Memory
title: Memory Shelf Entrance
description: The Recall Tube deposits you at the top of Long Term Memory with a faint pneumatic hiss. Towering shelves stretch in every direction, rising hundreds of feet overhead and vanishing into a dim haze below. Each shelf holds thousands of memory orbs arranged in neat rows, their soft glow painting the narrow corridors in shifting pastel light. A spiral stairway from the Headquarters Balcony arrives here as well, its final step worn smooth by generations of mind workers. The air is cool and still, carrying the faint hum of a billion stored moments.
mapsymbol: E
maplegend: Entrance
biome: mindscape
