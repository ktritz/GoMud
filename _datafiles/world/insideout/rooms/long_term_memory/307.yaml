roomid: 307
zone: Long Term Memory
title: Dusty Memory Corner
description: A dead-end alcove where the shelves crowd close and the ceiling dips low, creating a cramped, claustrophobic space choked with gray dust. Nearly every orb here is dark or deeply faded, their scenes reduced to vague impressions -- a color, a feeling, the ghost of a face with no name attached. Cobweb-like strands of decayed memory stretch between the shelves, and the dust is thick enough to muffle your footsteps. A narrow gap between the shelves leads deeper into the fading sections. The air is so stale it almost crackles when you breathe.
mapsymbol: D
maplegend: Dusty
biome: mindscape
exits:
  north:
    roomid: 306
  south:
    roomid: 308
nouns:
  dust: The dust here is ankle-deep in places. It piles against the shelf bases in drifts of powdered memory. If you sift through it carefully you can occasionally find a tiny shard of an orb -- a fragment that holds one last second of a forgotten moment before dissolving in your fingers.
  cobwebs: The strands connecting the shelves are not spider silk but the remnants of associations between memories. When one memory fades, the connections it had to other memories wither into these ghostly threads. Pull one and somewhere on a distant shelf, another memory dims slightly.
