roomid: 309
zone: Long Term Memory
title: Mind Worker Break Room
description: A surprisingly cheerful room carved out of the shelving structure, lit by warm overhead lamps that give it a cozy cafeteria feel. Battered tables and mismatched chairs fill the space, most of them occupied by squat, blue-gray mind workers on their break. A row of vending machines lines one wall, stocked with snacks that seem to exist only inside someone's head -- "Subconscious Snack Mix," "Déjà Vu Drops," and "Abstract Thought Pretzels." A bulletin board near the door is covered in work schedules, safety notices, and a flyer for the Mind Worker softball league. The room buzzes with quiet conversation and the clinking of cups.
mapsymbol: W
maplegend: Workers
