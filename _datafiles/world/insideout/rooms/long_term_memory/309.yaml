nouns:
  tables: The <ansi fg="itemname">tables</ansi> are scarred and stained from years of coffee rings and spilled Subconscious Snack Mix. Each one has a small nameplate claiming it for a different work crew -- "Shelf Team Alpha," "Recall Squad 7," and the ominous "Night Shift." Crumbs cover every surface.
  vending machines: The <ansi fg="itemname">vending machines</ansi> offer a bewildering selection. The drinks include "Liquid Nostalgia (Grape)" and "Focused Concentration Juice." One machine is labeled "OUT OF ORDER" but a mind worker tells you it has been that way since Riley was four. The prices are listed in "thought units."
  bulletin board: 'The bulletin board is cluttered with notices. "REMINDER: DO NOT REORGANIZE THE EMBARRASSING MEMORIES AGAIN." "Softball game Tuesday -- bring your own glove." "LOST: One memory of a phone number. If found, please return to Shelf 4,792." A safety poster reads "A Tidy Shelf Is A Happy Shelf."'
idlemessages:
- A mind worker at a nearby table slurps coffee loudly and stares at nothing.
- Two mind workers argue about whether a particular memory belongs in "School" or "Friends."
- Someone feeds coins into a vending machine and it dispenses a bag of Déjà Vu Drops.
- A mind worker checks the bulletin board, shakes their head, and walks away muttering.
- The coffee machine gurgles and produces a cup that smells like concentrated focus.
