nouns:
  toys: The <ansi fg="itemname">toys</ansi> are heartbreaking in their specificity. The stuffed bear's name was Mr. Buttons and Riley slept with him every night until she was seven. The tea set was a birthday present from her grandmother. The action figures were from a cartoon she watched every Saturday morning. Each toy is fading -- colors washing out, shapes softening, details dissolving -- but they maintain their positions, as if waiting for someone to play with them one more time.
  ball: The <ansi fg="itemname">ball</ansi> is a small soccer ball with a logo that is barely visible, the name of Riley's first team dissolved to a few scattered letters. It is half-deflated and covered in gray dust, but when you pick it up, it still has a faint bounce. Something in it remembers what it was for, even if Riley does not.
idlemessages:
- The stuffed bear tips over slowly, its remaining eye catching the light as it falls.
- A block in the tower crumbles to dust and the remaining blocks settle lower.
- The tea set clinks softly, as if invisible guests are having one more cup before the end.
- An action figure's arm breaks off and dissolves before it hits the ground.
- The ball rolls an inch on its own, propelled by the memory of being kicked.
