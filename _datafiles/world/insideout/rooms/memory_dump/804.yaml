roomid: 804
zone: Memory Dump
title: Forgotten Toy Graveyard
description: The dust plain is littered with the remains of Riley's forgotten toys -- childhood companions that were once the center of her world and are now dissolving into gray anonymity at the bottom of her mind. A stuffed bear with one eye sits propped against a fading block tower. A tea set missing most of its pieces is arranged in a circle, as if the toys had one last party before the forgetting took them. Action figures stand in frozen poses, their paint chipping away to reveal the gray nothing underneath. A half-deflated ball rests in a shallow crater, still bearing the faded logo of a team Riley used to love. Everything here is in the process of being unmade, slowly, gently, and with absolute finality.
mapsymbol: T
maplegend: Toys
