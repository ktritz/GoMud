roomid: 813
zone: Memory Dump
title: Corrupted Core
description: The heart of the Memory Dump is a pulsing, unstable mass of corrupted core memory that has absorbed so many forgotten experiences it has become something new and dangerous. The core hovers a few feet above the ground, a sphere of roiling dark energy shot through with veins of color that flash and die -- gold, blue, red, green, purple -- each one a core memory that fell too far and was consumed. The air around it crackles with psychic static, and the ground beneath it has been scorched clean, the memory dust vaporized by the intensity of so much concentrated loss. This is what happens when memories do not just fade but break -- they become angry, confused, and desperate, lashing out at anything that still has the coherence they have lost. The corrupted core is the Memory Dump's only permanent resident, and it has been growing.
mapsymbol: X
maplegend: Core
biome: dungeon
