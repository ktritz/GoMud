roomid: 814
zone: Memory Dump
title: The Way Back Up
description: Beyond the corrupted core, a narrow passage climbs steeply upward through the wall of the dump, carved by mind workers as an emergency escape route for anyone foolish enough to descend this far. The passage is lined with handholds driven into the rock at regular intervals, and faint guide lights are embedded in the walls, each one a tiny, warm point of gold that flickers like a candle flame. The climb is steep and the passage is narrow, but the air improves with every upward step -- warmer, more colorful, more alive. After the bleakness of the dump, the faint glow of Long Term Memory above is the most beautiful thing you have ever seen. The passage narrows to a final squeeze before opening onto the familiar shelves. You made it back. You remember.
mapsymbol: ^
maplegend: Way-Up
