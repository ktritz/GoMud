roomid: 802
zone: Memory Dump
title: The Gray Fog
description: The ledge descends into a thick, formless fog that reduces visibility to a few feet in every direction. The fog is not water vapor -- it is the collective exhalation of billions of dissolving memories, a gray mist of lost experiences so dense you can feel it against your skin. Shapes move in the fog -- slow, drifting silhouettes that might be the remnants of forgotten people, places, and things, wandering the dump in search of someone who still remembers them. The ground here levels off into a flat plain of compressed memory dust, soft and yielding underfoot. Sound behaves strangely in the fog; voices seem to come from every direction at once, always just too quiet to understand.
mapsymbol: '#'
maplegend: Fog
biome: dungeon
