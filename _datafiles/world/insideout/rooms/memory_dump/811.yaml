roomid: 811
zone: Memory Dump
title: Memory Dust Basin
description: 'The ground drops into a shallow basin filled with memory dust so deep it reaches your knees. This is the true bottom of the Memory Dump -- the lowest point in Riley''s mind, where the heaviest, most completely forgotten memories eventually settle. The dust here is warm and slightly luminous, heated by the compressed weight of a lifetime of discarded experiences. Wading through it produces a strange sensation: brief flashes of emotion that do not belong to you -- a moment of joy from a birthday you never had, a pang of sadness from a goodbye you never said, a spike of fear from a nightmare you never dreamed. The basin is a repository of pure, free-floating feeling, detached from any memory or context.'
mapsymbol: U
maplegend: Basin
biome: dungeon
