roomid: 801
zone: Memory Dump
title: Crumbling Memory Ledge
description: The ledge narrows as it descends along the chasm wall, its surface increasingly unstable. Chunks of stone have broken away and fallen into the void, leaving gaps that require careful steps to cross. Memory orbs are wedged into cracks in the rock, half-dissolved and barely glowing -- they rolled off the shelves above and got stuck here on their way down, clinging to the wall like the last grip of a thought you are trying not to lose. The orbs are too far gone to read clearly, their scenes reduced to blurred shapes and muted sounds. A section of the ledge ahead has collapsed entirely, replaced by a precarious bridge of compressed memory fragments that shifts under your weight.
mapsymbol: '~'
maplegend: Ledge
biome: dungeon
