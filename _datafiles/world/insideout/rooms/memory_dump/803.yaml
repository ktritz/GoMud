nouns:
  impression: 'The <ansi fg="itemname">impression</ansi> in the dust is unmistakably Bing Bong''s -- the outline of two oversized shoes, the drag mark of a long trunk, and the shallow depression where he sat down at the very end. The dust inside the impression is faintly pink, the last chemical trace of cotton candy slowly fading to gray. If you kneel beside it and listen, you can almost hear him: "Take her to the moon for me." Almost.'
  cotton candy: A few strands of faded pink <ansi fg="itemname">cotton candy</ansi> cling to the dust, the last physical remains of Bing Bong's body. They are gossamer-thin and nearly transparent, barely holding their color against the relentless gray of the dump. If you touch one, it dissolves between your fingers and for one vivid, heartbreaking moment you feel the pure, uncomplicated joy of a four-year-old making up an imaginary friend. Then it fades, and you understand what was lost here.
idlemessages:
- The impression in the dust glows faintly pink, then fades, like a heartbeat slowing down.
- A wisp of cotton candy scent drifts through the air and you feel a sudden, aching fondness for someone you never met.
- The ghost of a melody plays -- just four notes of "Who's your friend who likes to play" -- then dissolves into silence.
- The dust around the impression stirs, as if something is trying to reform from sheer force of love. It cannot. It tries anyway.
- A single tear-shaped drop of pink light falls from the air above the impression, lands in the dust, and is absorbed. The ground glows warmer for a moment.
