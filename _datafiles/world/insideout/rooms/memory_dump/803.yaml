roomid: 803
zone: Memory Dump
title: Bing Bong's Final Stand
description: The fog thins here, opening into a small, still clearing that carries a weight of memory the rest of the dump has lost. This is the place where Bing Bong -- Riley's imaginary friend, part cat, part elephant, part dolphin, all cotton candy -- made his last sacrifice. He jumped from the rocket wagon so Joy could fly free, and he dissolved here, slowly, piece by piece, asking only that Riley be taken to the moon for him. A faint impression remains in the dust where he stood at the end, shaped like oversized shoes and a long, curling trunk. Scattered around it are the last traces of him -- a few strands of faded pink cotton candy, the ghost of a song, and the lingering warmth of a love that was never reciprocated but never once regretted. The air here smells faintly of cotton candy and tastes like saying goodbye.
mapsymbol: B
maplegend: Bing-Bong
