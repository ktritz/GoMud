nouns:
  memory fragments: 'The <ansi fg="itemname">memory fragments</ansi> are monolithic, towering over you like standing stones in a forgotten temple. Each one radiates a faint warmth that feels like safety -- the deep, preverbal safety of being held when you are too small to understand anything except that you are loved. The scenes inside them are not scenes at all, just colors and feelings: gold warmth, blue curiosity, green discomfort, purple startle. They are the foundations of everything Riley became.'
  symbols: The <ansi fg="itemname">symbols</ansi> carved into the fragments are not any language -- they are a baby's attempt to mark experience. Circles that might mean "face." Wavy lines that might mean "sound." A shape like a star that might mean "light" or "love" or both, because at that age they were the same thing.
idlemessages:
- A fragment radiates a pulse of gold warmth and you feel a wordless sense of being safe.
- The symbols on a fragment glow briefly, and you experience a sensation you have no name for -- something from before you had names.
- Two fragments lean toward each other like ancient trees, their eroded surfaces barely touching.
- A wash of pure blue feeling emanates from the largest fragment -- the memory of curiosity before you knew what curiosity was.
- The dust around the fragments is a slightly warmer shade of gray, as if even forgetting has a harder time with memories this deep.
