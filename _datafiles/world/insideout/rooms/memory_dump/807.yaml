roomid: 807
zone: Memory Dump
title: Ancient Memory Fragment
description: 'A cluster of enormous memory fragments juts from the dust like the ruins of a collapsed building, each one the size of a car and far older than anything else in the dump. These are Riley''s earliest memories -- the ones formed before language, before conscious thought, before she had words for what she was experiencing. The fragments are massive and deeply eroded, their scenes reduced to pure color and sensation: a wash of gold warmth that might be her mother''s arms, a blur of blue cold that could be a first winter, a flash of red that was probably her first cry. They are beautiful and incomprehensible, monuments to a time when every experience was brand new and absolutely overwhelming. Ancient symbols are carved into the fragment surfaces -- Riley''s pre-verbal mind trying to record what it could not yet name.'
