roomid: 812
zone: Memory Dump
title: The Last Song
description: The dust basin rises on the far side into a clearing where the air is different -- warmer, softer, tinged with a faint pink glow that has no visible source. This is where Bing Bong's song still echoes -- the one he sang to power the rocket wagon, the one Riley sang with him on imaginary adventures to the moon. The melody loops endlessly, each repetition a little fainter, a little more distant, but still unmistakably present. "Who's your friend who likes to play? Bing Bong, Bing Bong." The song has been here since he dissolved, and somehow, in a place where everything fades, it has not faded completely. It is the most stubborn memory in the dump -- a song too loved to fully forget, echoing at the bottom of the mind like a heartbeat that refuses to stop.
