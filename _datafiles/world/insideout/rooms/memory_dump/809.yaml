roomid: 809
zone: Memory Dump
title: Pile of Lost Names
description: An enormous mound of gray dust rises from the floor of the dump, higher than your head and stretching wide in every direction. This is where names go when they are forgotten -- the names of classmates, teachers, neighbors, characters from books, the person who held the door open for you that one time. Faint letters surface in the dust and dissolve before you can read them, syllables of names that once meant something to someone. The pile shifts and settles constantly, new names arriving from above in a slow, silent rain. If you stand still long enough, you can feel names leaving you too -- the ones you have been meaning to remember and the ones you already lost without noticing.
mapsymbol: N
maplegend: Names
