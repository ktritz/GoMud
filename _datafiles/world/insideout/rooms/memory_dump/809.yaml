nouns:
  dust: The <ansi fg="itemname">dust</ansi> of the name pile has a different quality than the rest of the dump -- it whispers. Not words, exactly, but the shapes of words, the mouth-feel of syllables that no longer attach to anyone. If you plunge your hand in, names surface on your skin for a moment -- "Sarah," "Mr. K--," "that kid from camp" -- before dissolving back into anonymous gray.
  letters: The <ansi fg="itemname">letters</ansi> that surface in the dust are fragmentary and fleeting. An "M" appears, followed by an "a" and an "r" -- then dissolves before the name completes. Was it Marcus? Maria? Margaret? It does not matter anymore. The name is gone and the person it belonged to will never be recalled by this mind again.
idlemessages:
- Letters surface in the dust -- J, A, M, E -- and dissolve before you can read the name.
- You suddenly remember someone's name with perfect clarity. A second later, it is gone.
- The pile shifts as new names arrive from above, settling into the mass with a soft whisper.
- A name almost surfaces -- you can feel it on the tip of your tongue. Then it sinks back forever.
- The dust whispers syllables that almost form words but never quite connect.
