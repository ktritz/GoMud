nouns:
  trail: The <ansi fg="itemname">trail</ansi> is a strip of memory dust that has been compressed by the passage of something -- mind workers, perhaps, or the memories themselves on their way down. It is a slightly darker shade of gray than the surrounding plain, which is the only way to tell it exists at all. The edges blur and shift as you watch, the path literally forgetting where it goes.
  signposts: The <ansi fg="itemname">signposts</ansi> are relics of a time when the Memory Dump was maintained and navigable. Now they point in contradictory directions and their labels have faded to near-illegibility. One sign has been turned upside down. Another has been snapped in half, its arrow pointing straight into the ground. A third, the oldest, has dissolved to a smooth gray stick with no text at all.
idlemessages:
- The path ahead fades a shade lighter, losing another inch of itself to the forgetting.
- A signpost leans further to one side, its arrow now pointing at the ground.
- Your footprints disappear behind you almost immediately, the dust filling them in like water.
- The trail narrows and you feel a moment of vertigo, as if "forward" is a concept that is dissolving.
- A faded sign reads "REMEMBER TO--" and the rest is gone. You are not sure what you were supposed to remember.
