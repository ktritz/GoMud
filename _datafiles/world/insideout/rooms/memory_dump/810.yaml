roomid: 810
zone: Memory Dump
title: Colorless Expanse
description: All color has been drained from this section of the dump, leaving a landscape of absolute gray that extends in every direction without feature or variation. The memory orbs here have been forgotten so completely that even their emotional residue is gone -- no gold, no blue, no red, no green, no purple. Just gray. The light has no apparent source and casts no shadows, creating a flat, dimensionless space that plays tricks on your sense of depth and distance. The ground is indistinguishable from the sky, and the sky is indistinguishable from the ground, and you are somewhere in the middle of an emptiness that is so complete it becomes its own kind of presence. This is what total forgetting looks like.
mapsymbol: ' '
maplegend: Expanse
biome: dungeon
exits:
  south:
