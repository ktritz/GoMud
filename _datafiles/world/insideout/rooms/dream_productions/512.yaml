idlemessages:
- Something skitters across the ceiling, just out of sight.
- A door on one of the nightmare sets creaks open on its own, revealing only darkness.
- The temperature drops a few degrees and your breath fogs briefly in the air.
- A whisper that sounds almost like your name echoes from somewhere in the wing.
- The shadows between the set pieces seem to breathe, expanding and contracting slowly.
