roomid: 512
zone: Dream Productions
title: Nightmare Wing
description: 'The lighting shifts from theatrical to genuinely unsettling as you cross into the Nightmare Wing. The walls are darker here, a deep bruised purple, and the set pieces are built to disturb rather than entertain. Cages hold writhing shadow props. A corridor of doors opens onto scenes from Riley''s worst fears -- the empty school hallway, the unfamiliar city, the void where the floor should be. The air is colder and carries a faint electrical charge, like the moment before a bad dream goes really bad. Warning signs are posted everywhere: "AUTHORIZED NIGHTMARE PERSONNEL ONLY." The ceiling is lost in darkness above, and things move up there that you can hear but can''t see.'
mapsymbol: N
maplegend: Nightmare
biome: dreamset
