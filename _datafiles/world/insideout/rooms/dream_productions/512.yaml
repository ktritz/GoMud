nouns:
  set pieces: The <ansi fg="itemname">set pieces</ansi> are designed to tap into primal fears. A perfectly normal classroom that's somehow wrong in every detail. A hallway that stretches when you walk through it. A phone that rings but produces no sound when you answer. Each one is meticulously crafted to make the dreamer feel exactly the right amount of dread.
  signs: 'The <ansi fg="itemname">warning signs</ansi> are scattered everywhere. "CAUTION: UNCONTAINED ANXIETY BEYOND THIS POINT." "DO NOT FEED THE NIGHTMARES." "If you hear your name whispered, it''s part of the production. Probably." The signs themselves look slightly wrong -- the letters shift when you''re not looking directly at them.'
