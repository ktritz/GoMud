title: Script Archive
description: Towering filing cabinets fill this room from floor to ceiling, each drawer stuffed with scripts from every dream Riley has ever had. The cabinets are organized by year, then by emotion, then by a system that seems to involve color-coded stickers that nobody fully understands. A reading table in the center holds a few scripts pulled for review, their pages yellowed and curling at the edges. The oldest scripts, from Riley's toddler years, are simple -- "Warm. Bright. Mom." The newer ones are thick, complex, full of subtext and anxiety. A card catalog system with thousands of tiny drawers sits against the far wall, cross-referencing dreams by theme, recurring element, and "how weird was it on a scale of 1-10."
