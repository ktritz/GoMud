zone: Dream Productions
title: Studio Entrance Gate
description: A massive wrought-iron gate towers before you, emblazoned with the words DREAM PRODUCTIONS in gleaming marquee letters that flicker between gold and silver like old Hollywood signage. Two enormous spotlights sweep the perpetually twilight sky above, casting dramatic beams through a faint haze of stage fog. A velvet rope blocks the main entrance, but the turnstile beside it clicks invitingly. Beyond the gate, the sprawling backlot stretches out under a sky that can't decide if it's sunset or sunrise -- because in dreams, it's always both.
