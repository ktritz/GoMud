title: Broadcast Tower
description: A spiraling antenna rises through the center of this circular room, punching through the ceiling and extending upward toward Riley's sleeping consciousness. Control panels ring the base of the antenna, covered in dials, switches, and a single large broadcast lever labeled "SEND DREAM." Screens mounted on the walls show the current dream feed -- what Riley is experiencing right now as she sleeps. The antenna hums with a low, resonant frequency that you feel in your chest more than hear with your ears. Cables snake across the floor, connecting the tower to every soundstage, set, and effects lab in Dream Productions. This is the final step -- where finished dreams become the movies that play behind Riley's closed eyes.
