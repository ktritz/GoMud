- mobid: 43
  message: A <ansi fg="mobname">stage hand</ansi> backs through the door carrying a prop that's clearly too big for them.
  respawnrate: 10 real minutes
idlemessages:
- A rubber chicken on the top shelf honks softly for no reason whatsoever.
- A prop sword falls off a shelf, bounces, and somehow lands perfectly balanced on its tip.
- The jar of teeth rattles. You decide not to think about it.
- A doorknob on the shelf turns on its own, and you hear the distant sound of the ocean.
- Someone's left a half-eaten prop sandwich on the workbench. Wait, it might be a real sandwich.
