roomid: 507
zone: Dream Productions
title: Props Room
description: Floor-to-ceiling shelves packed with every conceivable prop crowd this room into a labyrinth of dream artifacts. Foam swords lean against rubber chickens. A jar labeled "TEETH (for the teeth dream)" sits next to a box of "GRAVITY -- REDUCED." One shelf holds nothing but doorknobs that each open onto a different dream. A workbench in the center is covered in half-finished props -- someone is building a new giant pencil and what appears to be a talking sandwich. Everything here is designed to look real enough for a dream but falls apart the moment you examine it too closely. Which is, of course, exactly how dreams work.
mapsymbol: P
maplegend: Props
biome: dreamset
