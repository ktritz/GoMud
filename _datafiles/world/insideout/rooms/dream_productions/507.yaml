nouns:
  shelves: The <ansi fg="itemname">shelves</ansi> are a treasure trove of dream logic. One section is labeled "THINGS THAT SHOULDN'T BE ABLE TO FLY (BUT DO)." Another holds "PHONES THAT DON'T WORK WHEN YOU NEED THEM." A third is just rows and rows of slightly wrong versions of everyday objects -- clocks with 13 hours, books with blank pages, shoes that are always the wrong size.
  doorknobs: 'The <ansi fg="itemname">doorknobs</ansi> are fascinating. Each one is a different style -- brass, crystal, wooden, one that appears to be made of chocolate. A small card beneath each one describes where it leads: "Childhood bedroom," "That classroom you''ve never actually been in," "Underwater but you can breathe."'
