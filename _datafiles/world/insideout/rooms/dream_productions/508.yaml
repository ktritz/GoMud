roomid: 508
zone: Dream Productions
title: The Green Room
description: A wave of deep comfort washes over you the moment you step inside. This is where dream actors rest between takes, and the room is designed for maximum relaxation. Plush couches in soft greens and golds form cozy clusters around low tables stacked with dream magazines. A refreshment table along one wall offers snacks that taste like whatever you want them to -- one bite and it's your favorite food, whatever that happens to be right now. Warm, indirect lighting fills the room with a soothing amber glow, and the faint hum of white noise generators smooths every sharp edge off reality. A sign on the wall reads "Rest well. You dream again in thirty minutes."
