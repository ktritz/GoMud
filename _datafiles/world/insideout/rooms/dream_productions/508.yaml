nouns:
  couches: The <ansi fg="itemname">couches</ansi> are impossibly comfortable -- the kind of furniture that only exists in dreams, which makes sense because that's literally where you are. The cushions seem to adjust to whoever sits on them, and they're warm without being hot. A couch this good in the waking world would cost a fortune.
  snacks: 'The <ansi fg="itemname">refreshment table</ansi> is stocked with dream snacks that defy description. Each one tastes different depending on who''s eating it. A label reads "Flavor: Yes." There are also drinks in unmarked cups that are simultaneously hot cocoa and cold lemonade.'
idlemessages:
- The couches seem to exhale softly, settling deeper into their own comfort.
- A warm breeze drifts through the room carrying the smell of freshly baked cookies.
- The white noise generators shift to the sound of gentle rain, then back again.
- A dream magazine flips its own pages to an article titled "Top 10 Flying Dreams of the Year."
- The amber lighting dims and brightens in a slow, soothing rhythm, like breathing.
