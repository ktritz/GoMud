roomid: 504
zone: Dream Productions
title: Soundstage C - Action
description: Everything in this soundstage is turned up to eleven. A partially destroyed city block set fills the main stage, complete with overturned cars made of foam, breakaway walls, and a fire hydrant that shoots real water on a timer. Pyrotechnic rigs line the ceiling, each one labeled with helpful notes like "SMALL BOOM," "MEDIUM BOOM," and "RILEY JUST ATE SPICY FOOD." A stunt mat the size of a swimming pool cushions the floor beneath a zip line that runs the full length of the stage. Somewhere a countdown is always running, and something is always about to explode. This is where the dreams that make you wake up with your heart pounding are born.
mapsymbol: A
maplegend: Action
biome: dreamset
exits:
