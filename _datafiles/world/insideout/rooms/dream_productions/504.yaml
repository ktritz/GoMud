nouns:
  city block: 'The <ansi fg="itemname">city block</ansi> is impressively detailed despite being entirely fake. The overturned cars are foam but painted to look like real wreckage. One building facade has a hole shaped suspiciously like a person who was thrown through it. A movie slate on the ground reads "CHASE DREAM #847 -- Take 1."'
  pyrotechnics: The <ansi fg="itemname">pyrotechnic rigs</ansi> are an elaborate network of launchers, sparklers, and smoke canisters. A safety manual is duct-taped to the wall, opened to a page that just says "Eh, it's a dream, what's the worst that could happen?" Signed by the Dream Director.
idlemessages:
- A pyrotechnic rig fires a burst of sparks across the ceiling with a satisfying CRACK.
- A foam car flips over in slow motion, lands, then resets itself for the next take.
- The fire hydrant erupts, spraying water everywhere before shutting off just as suddenly.
- An explosion rocks the far end of the stage and a crew member holds up a sign reading "COOL."
- The zip line whirs as an invisible stunt double zips across the soundstage.
