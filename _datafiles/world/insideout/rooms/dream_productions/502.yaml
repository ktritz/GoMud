roomid: 502
zone: Dream Productions
title: Soundstage A - Romance
description: Pink and red lights bathe this cavernous soundstage in the warm glow of manufactured love. A balcony set dominates the center, complete with plastic roses, a painted moon backdrop that's slightly crooked, and a wind machine pointed at a spot marked "STAND HERE FOR HAIR FLOWING." Racks of hilariously overdramatic costumes line one wall -- puffy sleeves, sparkly gowns, and at least three different prince outfits. A boom box in the corner is permanently set to play soft saxophone music. The whole set radiates the kind of cheesy romance that makes you cringe and secretly enjoy it at the same time.
