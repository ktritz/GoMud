roomid: 515
zone: Dream Productions
title: Catwalks Above Stage
description: Narrow metal catwalks crisscross high above the soundstages, offering a dizzying bird's-eye view of Dream Productions in its entirety. From up here, you can see all three soundstages at once -- the pink glow of Romance, the red flicker of Horror, the explosive flashes of Action -- all operating simultaneously like a three-ring circus of the subconscious. Spotlights hang from the rigging beside you, their massive housings warm to the touch. Ropes, pulleys, and sandbags dangle overhead, part of the elaborate rigging system that makes dream effects possible. The catwalk sways gently with every step, and looking down through the metal grating sends a thrill of vertigo through your stomach. A ladder on the far end descends toward the backlot below.
