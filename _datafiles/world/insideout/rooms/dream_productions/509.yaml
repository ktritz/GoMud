roomid: 509
zone: Dream Productions
title: Screening Room
description: A private theater with a dozen velvet seats faces an enormous screen that stretches wall to wall. This is where dream productions are reviewed before broadcast, and right now a reel of recent dreams plays on loop -- fragments of flying, snippets of school, a brief clip of a dog wearing a graduation cap. The projector behind you hums and clicks, casting dancing light across the ceiling. Boxes of discarded dream reels are stacked along the walls, each one labeled with a date and a title. The room smells like movie theater popcorn and the unique ozone tang of pure imagination running through a projector.
