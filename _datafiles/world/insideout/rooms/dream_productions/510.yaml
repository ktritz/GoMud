roomid: 510
zone: Dream Productions
title: Special Effects Lab
description: 'A mad scientist''s workshop if the scientist exclusively studied dreams. Bubbling vats of luminescent liquid line one wall, each a different color -- one swirls with the iridescent shimmer of flying dreams, another crackles with the electric blue of anxiety nightmares. Workstations covered in strange equipment fill the room: a machine that bottled déjà vu, a centrifuge for separating dream logic from regular logic, and a device labeled "EMOTIONAL AMPLIFIER -- USE SPARINGLY." Chalkboards on the walls are covered in formulas that mix neuroscience with pure nonsense. This is where the really weird dream effects are invented, tested, and occasionally unleashed on an unsuspecting Riley.'
