roomid: 503
zone: Dream Productions
title: Soundstage B - Horror
description: The temperature drops the moment you step through the heavy soundstage door. This set is dedicated to nightmares, and the production team has gone all out. Fog clings to the floor in thick, unnatural sheets, lit from below by flickering red lights that make every shadow look alive. A crumbling haunted school hallway stretches across the main stage, its lockers hanging open to reveal darkness that seems deeper than it should be. Fake cobwebs cover everything, though some of them feel disturbingly real. A sign near the entrance reads "NIGHTMARE DEPARTMENT -- Fear Approved, Joy Tolerated." The unsettling part is that the set feels less like a set and more like somewhere you've actually been in a bad dream.
