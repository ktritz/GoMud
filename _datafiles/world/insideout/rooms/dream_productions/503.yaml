idlemessages:
- A locker door slams shut on its own and the echo lingers far too long.
- The fog on the floor churns and for a moment you can almost see a face in it.
- The hallway seems to stretch a few feet longer when you're not looking directly at it.
- A distant school bell rings, muffled and distorted, from deep within the set.
- One of the red lights dies, plunging a corner into absolute darkness. Then it flickers back.
