nouns:
  lights: The <ansi fg="itemname">flickering red lights</ansi> are embedded in the floor, casting everything in a sinister upward glow. A label on one reads "ANXIETY SPECIAL -- Triple intensity, extra flicker. Approved for use in 'showing up to school in underwear' dreams and above."
  hallway: The <ansi fg="itemname">haunted school hallway</ansi> is an uncanny recreation of Riley's middle school, but wrong. The lockers are numbered in reverse, the clock on the wall runs backward, and the classroom doors open onto brick walls. It's the kind of place where you run and run but never reach the end.
