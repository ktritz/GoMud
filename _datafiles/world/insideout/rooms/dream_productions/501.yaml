nouns:
  sets: The <ansi fg="itemname">sets</ansi> are a magnificent mess of recycled dream material. A school hallway facade has lockers that open into a forest. A kitchen set has a fridge full of rubber chickens. One set is just labeled "THAT DREAM WHERE YOU'RE LATE FOR SOMETHING" and it's suspiciously well-worn.
  carts: 'The <ansi fg="itemname">equipment carts</ansi> are loaded with dream-making gear: fog machines, emotion-tinted lights, bottles labeled "FALLING SENSATION," and a box of rubber teeth marked "FOR THE TEETH DREAM -- HANDLE WITH CARE."'
idlemessages:
- A set piece topples over with a dramatic crash, then quietly stands itself back up.
- A crew member in a beret rushes past carrying an armful of fake clouds.
- The lighting shifts from golden hour to moonlight and back in the span of a few seconds.
- Someone yells "CUT!" from one of the soundstages, followed by muffled arguing.
- A cardboard tree falls over, revealing another cardboard tree behind it.
