roomid: 501
zone: Dream Productions
title: The Backlot
description: A sprawling open-air lot stretches in every direction, cluttered with half-built sets and towering facades that lead to absolutely nothing behind them. A fake mountain range made of painted plywood leans against a tropical beach backdrop, and a medieval castle front sits next to a cardboard spaceship. Rolling equipment carts loaded with props and lighting rigs crowd the pathways between soundstages. The ground is a mess of cables, tape marks, and chalk outlines where actors are supposed to stand. Everything has that peculiar dream logic to it -- a door opens onto a wall, a staircase leads sideways, and nobody finds any of it unusual.
