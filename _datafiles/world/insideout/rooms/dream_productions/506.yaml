nouns:
  costumes: The <ansi fg="itemname">dream costumes</ansi> range from mundane to magnificent. There's a perfectly normal school uniform hanging next to a full suit of crystal armor. A section labeled "EMBARRASSMENT WARDROBE" contains nothing but underwear and pajamas. The "HERO SECTION" has capes in every color and a leather jacket that makes you feel cool just looking at it.
  mirrors: The <ansi fg="itemname">mirrors</ansi> are disconcerting. One shows you in a ball gown. Another shows you in hockey gear. A third shows you in something you definitely wore in a dream once but can't quite remember. None of them show what you're actually wearing right now.
spawninfo:
- mobid: 43
  message: A <ansi fg="mobname">stage hand</ansi> appears from behind a costume rack, pushing a cart of freshly pressed outfits.
  respawnrate: 10 real minutes
idlemessages:
- A costume falls off its hanger and lands in a dramatically perfect pose on the floor.
- The mirrors flicker and every reflection changes outfits simultaneously.
- A sewing machine whirs to life on its own, stitching something sparkly at incredible speed.
- You catch a mirror showing you in an outfit you've never seen before. It looks great, honestly.
