roomid: 506
zone: Dream Productions
title: Costume Department
description: Racks upon racks of dream costumes fill this enormous wardrobe department, stretching back into what feels like an impossible amount of space. Every outfit Riley's subconscious has ever conjured hangs here -- astronaut suits next to medieval armor next to a disturbingly accurate recreation of what she wore on the first day of school. Full-length mirrors stand between the racks, and each one reflects you in a slightly different outfit, because that's just how dream mirrors work. A sewing station in the corner is manned by busy hands, stitching together tonight's wardrobe. Bolts of fabric in impossible colors -- colors that don't exist when you're awake -- lean against every surface.
mapsymbol: C
maplegend: Costumes
biome: dreamset
