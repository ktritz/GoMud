zone: Imagination Land
title: Princess Dream Castle
description: A fairy-tale castle rises in sparkling pink and silver splendor, its towers topped with pennants that flutter in a perpetual magical breeze. The walls are encrusted with gems that are almost certainly made of sugar, and the drawbridge is a giant candy bar spanning a moat of sparkling purple liquid. Inside, the great hall is draped in silk banners and lit by floating candelabras. A throne sits on a raised dais, sized for someone about four feet tall, with a tiara resting on its cushion. The castle has the unshakeable grandeur of a six-year-old's ultimate fantasy, and not a single thing about it is ironic. It is perfect.
