roomid: 410
zone: Imagination Land
title: Building Block Fortress
description: A massive fortress constructed entirely from giant building blocks rises in primary-colored splendor. Red, blue, yellow, and green blocks the size of cars are stacked in thick walls with crenellations along the top. Arrow slits are just gaps where blocks do not quite line up. The main gate is two blocks leaning against each other, and somehow the whole structure is both architecturally unsound and completely indestructible. Inside the walls, a courtyard holds a toy chest the size of a small building, its lid propped open to reveal a jumble of oversized toys and imagination supplies. The fortress smells like new plastic and the faint ozone of creative energy.
mapsymbol: '#'
maplegend: Fort
