roomid: 408
zone: Imagination Land
title: Stuffed Animal Zoo
description: An open-air zoo where the exhibits hold enormous stuffed animals the size of actual animals. Giant teddy bears lumber behind velvet ropes. A plush giraffe stretches its neck toward fake felt leaves. A massive stuffed elephant sprays imaginary water from its trunk. Most of the animals are cheerful and bright, but a few in the far enclosures have gone wrong -- their stitching is unraveling, their button eyes glow with an unsettling light, and their stuffing has been replaced with something darker. A sign at the entrance reads "PLEASE DO NOT FEED THE IMAGINATION ANIMALS" and below it, in smaller letters, "Especially the ones in the back."
mapsymbol: Z
maplegend: Zoo
biome: land
