nouns:
  stuffed animals: The <ansi fg="itemname">stuffed animals</ansi> are wonderfully absurd at this scale. A teddy bear the size of an actual grizzly sits in its enclosure, button eyes gleaming, a permanent smile stitched across its face. A plush lion yawns silently, revealing a mouth full of felt teeth. They move with the slow, deliberate grace of things that are not quite alive but not quite not.
  stitching: The corrupted animals in the back enclosures have stitching that writhes and shifts on its own. Thread that was once bright red or blue has darkened to black, and the seams pulse with a faint, unsettling glow. Whatever happened to these imaginary friends, it happened slowly, and it is not over yet.
spawninfo:
- mobid: 36
  message: A <ansi fg="mobname">corrupted imaginary friend</ansi> tears free from its enclosure, button eyes glowing an angry red, stitching writhing.
  respawnrate: 4 real minutes
idlemessages:
- A giant teddy bear waves slowly from its enclosure. Its smile does not waver.
- The plush giraffe bends down to examine you with enormous button eyes.
- A corrupted stuffed animal in the back enclosure shifts, its unraveling stitching twitching.
- A stuffed penguin waddles past the fence line, realizes its mistake, and waddles back.
- You hear a low growl from the dark enclosure in the back. Stuffed animals should not growl.
