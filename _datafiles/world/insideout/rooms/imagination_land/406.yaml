nouns:
  rocket: 'The <ansi fg="itemname">rocket</ansi> boosters on the wagon are rainbow-striped cylinders that once burned with the power of a child''s singing voice. They are cracked now, leaking wisps of multicolored light that drift upward and pop like soap bubbles. The fuel gauge reads "SONGS REMAINING: 0" but the engine still hums, as if it remembers how to fly even if nobody is singing.'
  wagon: The red <ansi fg="itemname">wagon</ansi> is battered but intact, its Radio Flyer-style body scratched and dented from adventures beyond counting. The interior still has a faded cushion and a candy-cane steering wheel. A nameplate on the side reads "THE BING BONG EXPRESS" in glitter glue letters, half of which have peeled off. It is the saddest and most wonderful thing in Imagination Land.
idlemessages:
- The rocket boosters flicker with rainbow light and the wagon shudders, remembering flight.
- A wisp of song drifts from the engine -- a few notes of a melody you almost recognize.
- A candy flower blooms at the edge of the crater, growing toward the wagon as if offering comfort.
- The steering wheel turns slightly on its own, pointing toward the sky.
- A fragment of a treasure map flutters in the breeze, its X marking a spot that probably does not exist anymore.
