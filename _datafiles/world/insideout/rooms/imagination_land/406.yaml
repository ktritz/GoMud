roomid: 406
zone: Imagination Land
title: Rocket Ship Crash Site
description: A red wagon lies on its side in a shallow crater, its rainbow-colored rocket boosters cracked and flickering with residual imagination energy. This is Bing Bong's legendary rocket wagon -- the one powered by song that could fly through the sky and make you feel like anything was possible. It crashed here some time ago, and the impact crater has become overgrown with candy flowers and crayon grass. Scattered around the wreck are fragments of old adventures -- a torn treasure map, a plastic sword, a jar of imaginary cookies. The wagon's song-powered engine still hums faintly, waiting for someone to sing it back to life.
mapsymbol: '!'
maplegend: Crash
biome: land
