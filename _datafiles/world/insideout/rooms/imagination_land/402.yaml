roomid: 402
zone: Imagination Land
title: French Fry Forest
description: A forest of towering golden fries stretches in every direction, each one a crispy, salt-dusted pillar rising twenty feet into the air. The canopy overhead is a lattice of crossed fries that filters warm, golden light down to the forest floor, which is covered in a soft layer of sea salt and what appears to be powdered cheese. The trees are warm to the touch and smell incredible -- the entire forest is basically a deep-fried paradise that no amount of growing up can make you stop loving. Pools of ketchup collect in natural depressions between the fry-trunks, and somewhere deeper in the forest you can hear the sizzle of new fries growing in.
mapsymbol: F
maplegend: Fries
biome: land
