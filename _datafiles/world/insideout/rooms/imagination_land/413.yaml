nouns:
  doodles: 'The <ansi fg="itemname">doodles</ansi> are a timeline of creativity. At floor level: a stick-figure family, a house with a triangle roof, a sun with a face. Mid-wall: superhero characters, elaborate mazes, the word "BORED" in bubble letters. Near the ceiling: surprisingly skilled portraits, abstract designs, and a beautifully detailed drawing of a hockey player mid-shot. Every boring moment in every class produced something here.'
  lettering: Several <ansi fg="itemname">names</ansi> are written on the wall in the elaborate, ornamental style of someone who should definitely be paying attention in class instead. Hearts, stars, and swirls surround each one. Some names are crossed out and replaced. The handwriting gets better over time, but the impulse stays exactly the same.
idlemessages:
- A stick figure peels off the wall, walks a few steps, and plasters itself back in a different spot.
- A new doodle appears near the ceiling in real time -- Riley must be in a boring class right now.
- Two animated doodles chase each other along the wall, leaving faint pencil trails.
- A bubble-letter word rearranges itself, changing from "BORED" to "BOARD" to "BORED" again.
- The hockey player doodle near the ceiling takes a shot, and a tiny drawn puck bounces off the wall.
