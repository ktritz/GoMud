roomid: 413
zone: Imagination Land
title: Doodle Gallery
description: The walls of this wide corridor are covered floor to ceiling in doodles -- an evolving gallery of every idle sketch, margin drawing, and notebook scribble Riley has ever produced. The earliest ones near the floor are crude stick figures and misshapen animals. Higher up, the drawings get more sophisticated -- comic characters, geometric patterns, the name of a crush written in increasingly elaborate lettering. Near the ceiling, the doodles are genuinely good, showing real artistic development. A few have peeled off the wall and walk around the gallery on their own, animated by the creative energy that made them. The whole corridor hums with the satisfied energy of every boring class that produced something beautiful in the margins.
