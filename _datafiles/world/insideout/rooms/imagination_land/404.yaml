roomid: 404
zone: Imagination Land
title: Lava Floor Living Room
description: A massive living room stretches before you, furnished with overstuffed couches, armchairs, and coffee tables -- all arranged in a chaotic obstacle course across a floor of bubbling, glowing lava. The furniture is the only safe ground. The lava itself is a vivid, cartoon orange, rolling in slow waves and occasionally belching a harmless puff of warm air. Throw pillows are scattered strategically as stepping stones between the larger pieces, and scorch marks on the furniture legs tell the story of countless daring leaps and narrow escapes. A massive sign on the wall reads "THE FLOOR IS LAVA" in dripping red letters, as if that needed clarification.
mapsymbol: L
maplegend: Lava
biome: land
