nouns:
  archway: The <ansi fg="itemname">archway</ansi> is architecturally absurd and structurally magnificent. Its left column is a stack of giant alphabet blocks. Its right column is a tower of frozen popsicles that never melt. The keystone at the top is a golden star that spins slowly and emits a faint chiming sound. Carved into the base are the words "ANYTHING IS POSSIBLE (Terms and conditions may apply during puberty)."
idlemessages:
- The archway shifts from electric blue to hot pink with a musical chime.
- A burst of glitter erupts from the top of the arch and rains down in slow motion.
- The cobblestone path ahead rearranges itself slightly, because of course it does.
- A butterfly made of crayon wax flutters through the gateway and dissolves into sparkles.
- The air shimmers and for a split second you see the outline of something that has not been imagined yet.
