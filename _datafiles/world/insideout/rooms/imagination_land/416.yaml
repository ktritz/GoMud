roomid: 416
zone: Imagination Land
title: House of Cards
description: A towering structure of giant playing cards rises around you, each card the size of a door and leaning against its neighbor in precarious balance. The house is enormous -- corridors, rooms, and staircases all made from cards that tremble with every footstep and sway in every draft. Face cards peer down from the walls with painted expressions that seem to follow you. The entire structure should have collapsed a thousand times over, and the air is thick with the tension of something that knows it is defying gravity and is getting nervous about it. Every surface vibrates with a faint, anxious energy. Walk carefully.
