nouns:
  bridge: The <ansi fg="itemname">bridge</ansi> is a physical rainbow, solid enough to walk on and vivid enough to make your eyes water. Each color band is about three feet wide and radiates its corresponding wavelength as warmth, sound, or scent. Walking across it is a full sensory experience. The bridge curves gracefully through the sky, connecting areas that would otherwise require hours of walking. There are no railings. There will never be railings.
idlemessages:
- You step on the red band and warmth floods up through your feet.
- The violet stripe hums with a melody you have never heard but somehow know by heart.
- A gust of wind sends a spray of rainbow mist off the edge of the bridge.
- The view from up here makes the whole of Imagination Land look like a painting in progress.
- The yellow stripe tickles your feet and you hear a distant, delighted giggle.
