zone: Imagination Land
title: Rainbow Bridge
description: A spectacular bridge of pure prismatic light arcs through the sky, connecting the far-flung regions of Imagination Land. Each stripe of the rainbow is a walkable surface, and stepping on different colors produces different sensations -- red is warm, blue is cool, yellow tickles, green smells like fresh grass, and violet makes you hear distant music. The bridge has no railings because railings are boring and this is Imagination Land. The view from the apex is staggering -- you can see Cloud Town, the French Fry Forest, the distant towers of the Princess Dream Castle, and territories of imagination that have not been explored yet, shimmering on the horizon like a promise.
