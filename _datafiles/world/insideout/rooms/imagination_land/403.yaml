roomid: 403
zone: Imagination Land
title: Trophy Town
description: 'Every surface in this gleaming plaza is covered with trophies. Giant golden cups, towering silver columns, enormous ribbons in first-place blue -- they line the streets, fill the windows of every building, and stack on top of each other in precarious towers that catch the light and throw it in brilliant flashes across the whole area. The trophies are for everything imaginable: "BEST AT HOCKEY," "MOST LIKELY TO BE AWESOME," "WINNER OF EVERYTHING ALWAYS." Inspirational banners hang from every lamppost, each one more aggressively motivational than the last. The whole town radiates the unshakeable confidence of a child who has not yet learned what second place feels like.'
mapsymbol: T
maplegend: Trophies
biome: land
