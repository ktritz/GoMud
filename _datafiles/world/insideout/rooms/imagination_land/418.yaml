nouns:
  canyon: The <ansi fg="itemname">canyon</ansi> is a masterwork of imagined geography. Its walls show strata of different adventures -- a layer of pirate gold, a vein of dinosaur bones, a seam of alien crystal. Every childhood adventure genre is represented in the geology, layered on top of each other like a cross-section of every story Riley ever loved.
  caves: 'The <ansi fg="itemname">caves</ansi> in the canyon walls come in two varieties: treasure caves, which glow golden and contain piles of imaginary loot, and danger caves, which are dark and make low rumbling sounds. An experienced adventurer can tell them apart. An inexperienced one has a more exciting time.'
