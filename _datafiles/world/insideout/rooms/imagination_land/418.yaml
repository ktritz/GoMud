roomid: 418
zone: Imagination Land
title: Adventure Canyon
description: A dramatic desert canyon carved from red and orange rock, its walls rising in sheer cliffs on either side of a winding trail. This is the action zone of Imagination Land, where every childhood adventure story plays out at full scale. Rope bridges span the gaps between cliff faces. Mysterious caves dot the canyon walls, some glowing with treasure light, others dark and ominous. The trail is marked with painted arrows and the footprints of a hundred imaginary expeditions. Something moves in the shadows of the canyon walls -- not all of Imagination Land is friendly, and this is where the mind keeps the things that make adventures dangerous enough to be exciting.
