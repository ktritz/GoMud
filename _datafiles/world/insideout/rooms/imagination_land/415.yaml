nouns:
  imaginary friends: The developing <ansi fg="itemname">imaginary friends</ansi> are fascinating to watch. One pod contains what appears to be a dragon made of pillows. Another holds a superhero whose costume keeps changing colors. A third has something that is half cat, half spaceship, and entirely confident about it. Each one is being built from scratch by the raw material of imagination.
  humming: The <ansi fg="itemname">humming</ansi> is not mechanical -- it is the sound of creative energy doing its work. It changes pitch and tone based on what is being created. Dragon ideas make it rumble. Fairy ideas make it chime. The half-cat-half-spaceship makes it produce a sound that should not exist but does.
idlemessages:
- A pod near the wall pulses and the shape inside gains a pair of wings. Then loses them. Then gains four.
- The humming shifts to a lower register as a new imaginary friend begins to take form.
- A nearly-mature imaginary friend presses a hand against its pod wall and waves.
- Creative energy swirls through the room in ribbons of color, feeding into the pods.
- A pod pops open prematurely, releasing a half-formed idea that bounces off the walls before dissolving.
