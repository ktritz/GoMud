roomid: 415
zone: Imagination Land
title: Imaginary Friend Nursery
description: A soft, warm room where new imaginary friends are born. Incubation pods line the walls, each one a translucent bubble filled with swirling creative energy. Inside them, vague shapes are slowly forming -- a wing here, a tentacle there, a face that keeps changing its mind about how many eyes it wants. Some pods are nearly mature, containing recognizable figures that press against the walls of their bubbles. Others hold only a spark of an idea, a single trait like "funny" or "brave" or "can fly" waiting to grow into a full personality. A gentle humming fills the room, the sound of imagination at work, quietly building friends for a mind that needs them.
mapsymbol: N
maplegend: Nursery
