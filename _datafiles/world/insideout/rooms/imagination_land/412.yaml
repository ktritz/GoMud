nouns:
  finger paintings: The <ansi fg="itemname">finger paintings</ansi> are magnificent in their absolute lack of technique. Bold smears of red, blue, and yellow cover the walls in patterns that mean everything to the artist and nothing to anyone else. One is labeled "FAMLEE" in backwards letters. Another is just a handprint, small enough to break your heart.
  kitchen: The toy <ansi fg="itemname">kitchen</ansi> is fully stocked with plastic food -- rubber fried eggs, foam bread, a wooden cake that weighs nothing. The stove makes no heat and the sink has no water, but the meals prepared here are served with the gravity of a five-star restaurant. A tiny menu on the counter offers "SOOP," "CAKE," and "SPSGETTI."
idlemessages:
- A stack of wooden blocks topples over with a cheerful clatter, then slowly rebuilds itself.
- The tea party table resets its cups and saucers, ready for another round.
- A finger painting on the wall shifts colors slightly, as if being painted over in real time.
- The toy kitchen dings and produces a fresh plastic pie from its cardboard oven.
- A tiny chair scoots back from the table on its own, inviting someone very small to sit down.
