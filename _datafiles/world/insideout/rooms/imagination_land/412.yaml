roomid: 412
zone: Imagination Land
title: Preschool Playroom
description: The imagination here is younger, simpler, and achingly sweet. This playroom is filled with the earliest forms of creative play -- finger paintings on the walls in bold, uncoordinated smears of color, a pile of wooden blocks that have been stacked and knocked over a thousand times, and a toy kitchen where plastic food is served with absolute seriousness. The colors are brighter here, more saturated, as if seen through the eyes of someone for whom everything is still new. A tiny table with tiny chairs sits in the center, set for a tea party that has been going on for years. The whole room radiates the fierce, uncomplicated imagination of a three-year-old.
