zone: Imagination Land
title: Cardboard Box Spaceship
description: You are standing inside a cardboard box that is definitely, absolutely, one hundred percent a spaceship. The interior has been decorated with drawn-on control panels, paper plate portholes showing a convincing star field, and a captain's chair made from a stack of phone books covered with a blanket. Aluminum foil covers every surface that is supposed to be metal, and a paper towel tube serves as the main thruster control. The stars outside the portholes move slowly, because this ship is currently cruising at imagination speed through the cosmos. A crayon sign above the door reads "S.S. AWESOME -- No Girls Allowed" with "Girls" crossed out and "Boring People" written above it.
mapsymbol: '='
maplegend: Ship
