nouns:
  cardboard box: The <ansi fg="itemname">cardboard box</ansi> is from a refrigerator, judging by the faded product label on the outside. But inside it is the bridge of a starship. The transformation is complete and non-negotiable. If you say "this is just a box" out loud, the star field outside the portholes will stutter. Do not do that.
  control panels: The <ansi fg="itemname">control panels</ansi> are drawn on the cardboard walls in marker. Buttons are labeled "LASERS," "SHIELDS," "WARP DRIVE," and "SNACK DISPENSER." The snack dispenser button has been pressed so many times the cardboard is worn through. Someone has added more advanced controls in a different handwriting -- "QUANTUM NAVIGATION" and "AUXILIARY POWER" -- evidence of the imagination growing up but not giving up.
idlemessages:
- The star field outside the portholes drifts slowly to the left. The ship is definitely moving.
- A paper plate porthole rattles as the ship encounters mild imaginary turbulence.
- The thruster control tube rolls across the floor and bumps against the captain's chair.
- A distant sound effect -- clearly someone saying "pew pew" -- echoes through the hull.
- The aluminum foil walls crinkle and catch the starlight, which is actually just a flashlight taped to the ceiling.
