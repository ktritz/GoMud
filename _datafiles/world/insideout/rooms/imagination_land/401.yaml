roomid: 401
zone: Imagination Land
title: Cloud Town
description: An entire neighborhood built on and out of clouds. Cottages of compressed cumulus sit along a street paved with flattened cirrus, their fluffy walls slightly translucent and glowing from within with soft pastel light. Everything here is bouncy -- the ground gives pleasantly under each step, the fences wobble when touched, and the mailboxes bob gently in a breeze that seems to come from nowhere. A cloud builder works at a station near the town square, shaping raw cloud material into furniture and architectural elements with practiced hands. The whole place smells like the air after a rainstorm, clean and full of possibility.
