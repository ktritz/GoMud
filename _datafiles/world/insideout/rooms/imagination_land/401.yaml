nouns:
  clouds: The <ansi fg="itemname">clouds</ansi> that make up everything here are surprisingly solid -- firm enough to walk on, soft enough to sink your fingers into. They are warm to the touch and slightly damp, like a towel fresh from the dryer. If you pull off a piece, it reforms within seconds. The cottages are built by layering clouds of different densities, creating walls you can lean against but also put your hand through if you push hard enough.
spawninfo:
- mobid: 39
  message: A <ansi fg="mobname">cloud builder</ansi> materializes from a thick bank of fog, tools in hand and ready to trade.
  respawnrate: 2 real minutes
idlemessages:
- A cloud cottage settles slightly, like a souffle that got startled.
- A mailbox drifts six inches to the left, then drifts back. Nobody seems concerned.
- You bounce slightly with each step. The ground here has opinions about gravity.
- A wisp of cloud breaks free from a rooftop and floats upward, becoming a tiny hat-shaped cloud.
- The cloud builder hums a tune while sculpting a new piece of furniture from raw nimbus.
