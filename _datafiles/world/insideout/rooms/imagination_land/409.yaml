roomid: 409
zone: Imagination Land
title: Crayon Meadow
description: A wide, rolling meadow stretches before you, and every single thing in it is drawn in crayon. The grass is thick green strokes. The flowers are bright wax spirals of red, yellow, and purple. The sky overhead is colored in with that specific shade of blue that only comes in the big crayon box. A bright yellow sun with a smiley face beams down from the corner of the sky, because that is where suns go in crayon drawings. The ground has a waxy texture underfoot, and the whole world smells like that specific, nostalgic crayon smell that is impossible to describe but impossible to forget. Birds drawn as simple M-shapes glide overhead.
mapsymbol: '~'
maplegend: Meadow
biome: land
