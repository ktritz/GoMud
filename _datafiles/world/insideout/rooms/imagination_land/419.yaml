roomid: 419
zone: Imagination Land
title: Bottomless Pit Edge
description: The terrain of Imagination Land ends abruptly at the edge of a vast pit that drops into absolute darkness. This is the boundary between creation and oblivion -- below lies the Memory Dump, the final resting place of everything the mind discards. The edge is ragged and crumbling, and chunks of Imagination Land occasionally break free and tumble silently into the void. A weathered guardrail made of popsicle sticks provides questionable protection. The view is sobering -- from here you can see how close imagination and forgetting really are, separated by nothing more than a crumbling lip of colorful rock and a child's belief that the things they love will last forever.
mapsymbol: '!'
maplegend: Pit
biome: land
