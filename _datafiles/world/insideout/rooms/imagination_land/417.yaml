zone: Imagination Land
title: Cookie Factory
description: A whimsical factory that produces imagination cookies on an industrial scale. Conveyor belts carry trays of cookies in impossible flavors through ovens shaped like smiling faces. The air is thick with the smell of baking -- chocolate chip, snickerdoodle, peanut butter, and flavors that can only exist in someone's head, like "the smell of a snow day" and "the feeling of winning." Frosting pipes dispense decoration in every color, and a quality control station manned by nobody rejects cookies that are not fun enough. The whole operation runs on pure creative energy and produces far more cookies than any mind could ever consume. There are always more cookies.
