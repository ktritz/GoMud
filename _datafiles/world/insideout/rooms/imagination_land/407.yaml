  north:
    roomid: 406
  south:
    roomid: 408
nouns:
  machine: 'The <ansi fg="itemname">machine</ansi> is equal parts absurd and impressive. Its inner workings are visible through glass panels -- gears shaped like hearts, pistons that move in the rhythm of a slow dance, and a central furnace that burns with the exact shade of pink you see in a sunset. A warning label reads "CAUTION: Imaginary boyfriends are not real. They will, however, always text back."'
spawninfo:
- mobid: 37
  message: The machine hums to life and an <ansi fg="mobname">imaginary boyfriend</ansi> steps through the heart-shaped archway, hair perfect, smile genuine.
  respawnrate: 3 real minutes
idlemessages:
- An <ansi fg="mobname">imaginary boyfriend</ansi> steps off the conveyor and says "I just think you're really brave."
- The machine whirs and produces a boyfriend who immediately offers to carry something heavy.
- '"I wrote you a poem," announces a freshly generated boyfriend. "It''s about your eyes."'
- An <ansi fg="mobname">imaginary boyfriend</ansi> leans against the machine and says "I cleared my whole schedule. For you."
- The machine briefly malfunctions and produces two boyfriends who compete to see who can be more supportive.
