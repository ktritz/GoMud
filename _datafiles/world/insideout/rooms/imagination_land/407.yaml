zone: Imagination Land
title: Imaginary Boyfriend Generator
description: 'A massive, ridiculous machine dominates this clearing, all chrome pipes, blinking lights, and a conveyor belt that feeds into a heart-shaped archway. The machine''s purpose is printed in enormous pink letters on the side: "IMAGINARY BOYFRIEND GENERATOR -- Now With 40% More Emotional Availability." A control panel offers options for height, hair color, and "willingness to share feelings on a scale of 1 to 10 (all options are 10)." The conveyor belt hums and occasionally produces an imaginary boyfriend who steps through the archway, immediately says something supportive, and gazes into the middle distance with perfect cheekbones.'
mapsymbol: H
maplegend: Boyfriends
biome: land
