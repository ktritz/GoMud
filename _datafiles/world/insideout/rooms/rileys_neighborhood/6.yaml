zone: Rileys Neighborhood
title: Andersen Sidewalk
description: A tree-lined residential sidewalk stretches east toward the busier streets. The concrete is cracked in places where old tree roots have pushed through, and someone has drawn a hopscotch grid in faded chalk. A row of mailboxes stands at attention along the curb, some with little red flags up. A neighbor's orange tabby cat sits in a sunny patch of sidewalk, watching you with supreme disinterest.
