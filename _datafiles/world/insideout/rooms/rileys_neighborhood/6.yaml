nouns:
  tree: Mature trees arch over the sidewalk, their branches forming a leafy canopy that filters the light into shifting green patterns on the pavement. A few have initials carved into them. One has a knothole that looks suspiciously like a face.
  mailboxes: The <ansi fg="itemname">mailboxes</ansi> are a mismatched collection -- one plain black, one painted to look like a little barn, and one with a "NO JUNK MAIL" sticker that clearly isn't working because junk mail is sticking out of it.
  cat: The <ansi fg="itemname">tabby cat</ansi> is a big, well-fed orange tom with a torn ear and a collar that says "Mr. Briggs." He looks at you like he owns the entire block, which, to be fair, he probably thinks he does.
idlemessages:
- The orange cat stretches languidly and resettles in its sunny spot.
- A mail carrier rounds the corner, bag slung over one shoulder, headphones in.
- A kid on a scooter zips past on the other side of the street.
- A sprinkler starts up in someone's front yard with a tch-tch-tch-tch sound.
- Mr. Briggs the cat yawns, showing every single one of his teeth.

