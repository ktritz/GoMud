title: Linen Closet
description: A narrow closet packed floor to ceiling with towels, sheets, and the kind of household supplies that accumulate over years. The shelves are slightly bowed under the weight. There's a system here that only Mom understands -- beach towels on the left, bath towels in the middle, guest sheets on the right, and a mysterious top shelf of things that haven't been touched since the move from Minnesota. It smells like laundry detergent and cedar sachets.
mapsymbol: c
maplegend: Closet
biome: city
