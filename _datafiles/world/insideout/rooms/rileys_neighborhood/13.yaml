  north:
    roomid: 16
  south:
    roomid: 14
nouns:
  dumpsters: The <ansi fg="itemname">dumpsters</ansi> are industrial green and overflowing with black garbage bags. One lid is propped open by a broken wooden pallet. Something in there smells terrible. You don't want to investigate further.
  graffiti: The <ansi fg="itemname">graffiti</ansi> is layered thick on the alley walls. There's a pretty good mural of a whale, mostly covered by newer tags. Someone wrote "FEAR IS A LIAR" in wobbly red spray paint near the ground. Below that, someone else wrote "no it isn't" in marker.
