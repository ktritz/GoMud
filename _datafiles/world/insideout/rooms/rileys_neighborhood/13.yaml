roomid: 13
zone: Rileys Neighborhood
title: Back Alley
description: A narrow alley cuts between the backs of buildings, lined with overflowing dumpsters and stacked recycling bins. The walls on either side are brick, streaked with grime, and decorated with layers of graffiti ranging from elaborate murals to hastily sprayed tags. The ground is damp and littered with fast food wrappers and crushed cans. It's not exactly dangerous, but it's the kind of place where weird things skitter in the shadows. Something about the air here feels heavier, like bad thoughts tend to collect in places like this.
mapsymbol: '!'
maplegend: Alley
biome: city
