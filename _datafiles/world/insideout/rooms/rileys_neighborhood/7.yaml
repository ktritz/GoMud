title: Park Entrance
description: A wrought-iron gate marks the entrance to Andersen Heights Park. The gate is always open -- the latch broke years ago and nobody bothered fixing it. Old oak trees tower on either side, their branches reaching across to form a natural archway. A wooden sign reads "Andersen Heights Park - Est. 1952" in carved letters. The path splits ahead, leading north toward the playground and east toward the community garden. You can hear kids and the squeak of swing chains from deeper inside.
