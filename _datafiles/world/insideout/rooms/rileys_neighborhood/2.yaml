title: Riley's Front Yard
description: A short brick walkway leads up to a cheerful yellow house with a bright red door. The front yard is small but well-kept, with a patchy lawn and a little garden of wildflowers along the fence. An old swing set sits off to one side, its chains slightly rusted -- it looks like it hasn't been used in a couple of years, but nobody has gotten around to taking it down. A welcome mat at the front door says "The Andersens" in cheerful script.
mapsymbol: Y
maplegend: Yard
