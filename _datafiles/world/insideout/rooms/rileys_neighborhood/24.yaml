title: Upstairs Hallway
description: A narrow hallway with family photos lining both walls, creating a timeline from Riley as a baby to last year's school picture. The carpet is worn thin in a path down the middle from years of back-and-forth to bedrooms and the bathroom. A nightlight shaped like a hockey puck is plugged into an outlet near the floor -- left over from when Riley was younger but nobody has unplugged it. Doors lead to the bedrooms and bathroom, and a pull-cord hangs from a ceiling panel leading to the attic.
