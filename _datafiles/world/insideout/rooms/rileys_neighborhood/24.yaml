nouns:
  photos: The <ansi fg="itemname">family photos</ansi> are arranged in rough chronological order. Baby Riley in a snowsuit. Toddler Riley with cake on her face. Kid Riley holding a hockey stick taller than she is. Tween Riley looking awkward at a school dance. Each one is slightly crooked and at a slightly different height, like they were hung one at a time over years without a plan.
  nightlight: The <ansi fg="itemname">hockey puck nightlight</ansi> glows a faint orange. Riley stopped needing it years ago but it's become part of the hallway. Unplugging it would feel wrong somehow, like removing a load-bearing decoration.
  cord: A <ansi fg="itemname">pull-cord</ansi> hangs from a ceiling panel, leading to the attic above. It looks like it hasn't been pulled in a while -- there's a thin layer of dust on the handle.
idlemessages:
- The nightlight flickers and steadies.
- A floorboard creaks somewhere down the hall.
- The house settles with a soft groan.
