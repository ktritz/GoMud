title: Parents' Bedroom
description: Mom and Dad's bedroom is the most put-together room in the house. The bed is actually made, with a quilt from Grandma draped over the foot. Matching nightstands hold matching lamps and very different reading material -- Mom's side has a novel with a bookmark two-thirds through, Dad's side has a fly-fishing magazine and his reading glasses. A dresser against the wall has a jewelry box, a framed wedding photo, and a dish of loose change. The room smells faintly of Mom's perfume and the eucalyptus candle she lights every evening.
