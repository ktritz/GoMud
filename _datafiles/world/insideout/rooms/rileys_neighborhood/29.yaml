roomid: 29
zone: Rileys Neighborhood
title: Attic
description: A cramped attic space with sloped ceilings and exposed rafters. Dust motes float in the thin shafts of light that squeeze through a small round window at the far end. The space is packed with the accumulated debris of family life -- old suitcases, a broken exercise bike, holiday decorations in labeled bins, and a stack of yearbooks from Mom's high school days. Cobwebs connect everything to everything else like a second architecture. In the far corner, behind a stack of boxes, there's a faint shimmer in the air -- the same prismatic light you've noticed under Riley's bed, but stronger here, pulsing with colors that don't have names.
mapsymbol: A
maplegend: Attic
biome: city
