title: Entryway
description: A small entryway with a coat rack overflowing with jackets and a shoe rack that's more of a shoe pile. The hardwood floor is scuffed near the door from years of foot traffic. A mirror on the wall has a sticky note that says "KEYS!" in Mom's handwriting, stuck right at eye level. A staircase leads up to the second floor, and the rest of the ground floor opens up ahead.
