nouns:
  fridge: The <ansi fg="itemname">fridge</ansi> is a museum of the Andersen family's life. Alphabet magnets spell out something that might have once been "RILEY ROCKS" but now reads "RILE OCKS." There's a coupon for pizza, a dentist appointment card, and a photo of the family dog they had in Minnesota. Inside, you know there's leftover broccoli pizza that nobody wants.
  counter: The <ansi fg="itemname">counter</ansi> has a cutting board with a few bread crumbs, a jar of peanut butter with the lid off, and three mugs in various states of being washed. Mom's "World's Okayest Cook" mug is front and center.
  drawings: The <ansi fg="itemname">drawings</ansi> on the fridge are from when Riley was maybe five or six. One shows a yellow house with a red door and a smiling sun. Another is a crayon portrait of the family with arms way too long and heads way too big. They're curling at the edges but nobody would ever think of taking them down.
spawninfo:
