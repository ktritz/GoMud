title: Riley's Kitchen
description: A bright, modern kitchen with white tile and butcher-block countertops. The counter is cluttered with the usual stuff -- a fruit bowl, a toaster, and a half-empty bag of chips someone forgot to clip shut. The fridge is covered in magnets, takeout menus, and a couple of drawings from when Riley was little. There's a lingering smell of coffee and whatever Mom made for dinner last night. A window above the sink looks out into the tiny backyard.
