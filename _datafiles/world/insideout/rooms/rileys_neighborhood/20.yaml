nouns:
  view: The <ansi fg="itemname">view</ansi> is genuinely spectacular. The bay stretches out to the horizon, gray-blue water meeting gray-white sky. Alcatraz sits out there looking appropriately gloomy. The hills of Marin County rise on the far side, green and hazy. On a clear day you can supposedly see all the way to the Farallon Islands, but today isn't that day.
  bridge: The <ansi fg="itemname">Golden Gate Bridge</ansi> stands in the distance, its International Orange towers cutting through the fog like they were built to do exactly that. Even half-hidden, it's impossible to miss. You still remember the first time you saw it after the move from Minnesota. It didn't feel real.
  bay: The <ansi fg="itemname">bay</ansi> is alive with movement -- whitecaps on the chop, sailboats tacking against the wind, a container ship inching toward the port. The water changes color depending on the light, shifting between green and gray and sometimes a surprising blue. Seagulls wheel and dive, screaming at each other over fish.
idlemessages:
- Fog rolls in slowly across the bay, swallowing the base of the Golden Gate Bridge.
- A sailboat tacks across the wind, its white sail bright against the gray water.
- The wind picks up, whistling through the railings of the bridge overlook.
- A seagull lands on the railing, eyes you hopefully, then launches itself back into the wind.
- The fog horn sounds somewhere in the distance, low and mournful.
