title: Bridge Overlook
description: A pedestrian bridge arches over the roadway below, opening up to a stunning view of the San Francisco bay. The Golden Gate Bridge rises in the distance, its orange towers half-swallowed by the rolling fog. The water below is steel-gray and choppy, dotted with sailboats and the occasional ferry. The wind is stronger up here, tugging at your clothes and carrying the salt smell of the ocean. It's the kind of view that makes you stop and just stand there for a minute, even if you've seen it a hundred times. The railing is lined with locks that couples have attached -- a tradition that someone keeps trying to stop and no one listens.
