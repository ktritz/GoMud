roomid: 16
zone: Rileys Neighborhood
title: Sidewalk Crossing
description: A four-way intersection where two residential streets cross under a blinking yellow traffic light. Faded crosswalk stripes are painted on the asphalt in every direction. To the north, the park's tree line is visible over the rooftops. To the south, a narrow alley dips between the buildings. The busier Oak Street runs east-west here, and the side streets are quieter, shaded by old trees. A fire hydrant on the corner has been painted to look like a little person by someone with more enthusiasm than skill.
