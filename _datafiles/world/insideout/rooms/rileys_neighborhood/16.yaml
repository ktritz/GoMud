nouns:
  hydrant: The <ansi fg="itemname">fire hydrant</ansi> has been painted to look like a tiny firefighter, complete with a yellow helmet on the top cap and little arms on the side nozzles. The face is a bit lopsided. It's actually kind of charming.
idlemessages:
- The traffic light blinks yellow, then yellow, then yellow.
- A car stops at the intersection, waits for no one, then drives through.
- Someone walks their dog across the crosswalk. The dog stops to sniff the fire hydrant.
- A skateboarder rolls through the intersection without slowing down.
