title: Riley's Street
description: A quiet suburban street winds through a row of painted Victorian houses, their pastel facades softened by a thin veil of San Francisco fog. Overhead wires crisscross between wooden utility poles, and a few parked cars line the curb with their windows fogged over. A weathered neighborhood sign stands near the sidewalk with a simple map of the area. The air smells like eucalyptus and damp pavement, and somewhere down the block a dog is barking at nothing.
