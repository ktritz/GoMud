nouns:
  counter: The <ansi fg="itemname">counter</ansi> is a battlefield. Riley's hair ties form a colony near the faucet. A tube of toothpaste has been squeezed from the middle, which Dad has opinions about. Three different kinds of shampoo sit in the shower caddy, none of them more than a quarter full.
  curtain: The <ansi fg="itemname">shower curtain</ansi> has a detailed world map on it. Minnesota is circled in Sharpie with a little heart next to it. Someone -- probably Riley -- has also drawn a dotted line from Minnesota to San Francisco with "we are here" and an arrow. It's strangely touching.
  mirror: The <ansi fg="itemname">mirror</ansi> is slightly fogged even though nobody has showered recently. If you look closely, you can see where someone drew a smiley face in the steam that left a faint residue.
idlemessages:
- The faucet drips in a steady rhythm.
- The bathroom fan hums on its own for a moment, then stops.
