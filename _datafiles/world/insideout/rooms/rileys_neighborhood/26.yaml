title: Upstairs Bathroom
description: The upstairs bathroom is the kind of shared space that has caused at least three family arguments this week. Riley's side of the counter is a chaos of hair ties, a half-squeezed tube of toothpaste, and a phone charger that definitely shouldn't be near water. Mom has tried to organize it with little baskets that have been completely ignored. The shower curtain has a map of the world on it -- Dad's choice -- and someone has drawn a tiny hockey stick on Minnesota with a Sharpie.
