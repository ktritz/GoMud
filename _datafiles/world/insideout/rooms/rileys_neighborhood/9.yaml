zone: Rileys Neighborhood
title: Park Bench Area
description: A quiet spot tucked away from the playground noise. Two wooden benches sit under the wide canopy of a massive old oak tree, its branches reaching out in every direction like it's trying to hug the whole park. Dappled sunlight filters through the leaves and makes shifting patterns on the ground. It's the kind of place where people come to think, or read, or just sit and watch the world go by for a while. Someone has left a paperback on one of the benches.
