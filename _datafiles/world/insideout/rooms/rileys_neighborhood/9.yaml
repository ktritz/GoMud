nouns:
  bench: The <ansi fg="itemname">benches</ansi> are old wood-and-iron park benches with backs worn smooth by years of sitting. Someone has carved "J+K" inside a heart on one of them. The paperback left behind is a beat-up copy of a mystery novel with the last fifty pages missing.
  oak: The <ansi fg="itemname">oak tree</ansi> is ancient and enormous, its trunk gnarled and twisted with age. You could probably fit three people inside the hollow where two massive roots diverge from the base. The bark is thick and deeply ridged, and if you look closely you can see ants marching in a line up toward the canopy.
  tree: :oak
idlemessages:
- A jogger passes through, breathing hard, gives you a nod.
- A person walks by with a golden retriever that wants to say hi to everyone.
- A leaf spirals down from the oak tree and lands on the bench.
- The breeze picks up for a moment, rustling through the oak's canopy like a whispered conversation.
