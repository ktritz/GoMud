roomid: 8
zone: Rileys Neighborhood
title: Park Playground
description: The playground is a colorful sprawl of swings, a tall slide, and a set of monkey bars with chipped paint. The ground is covered in that spongy rubber stuff that's supposed to make falling hurt less (it doesn't, really). A few younger kids are running around and yelling at full volume. The whole place has that nostalgic pull -- you spent a lot of afternoons here when the family first moved to San Francisco, back when making friends felt impossible and the swings were the only place that felt normal.
mapsymbol: P
maplegend: Playground
biome: city
