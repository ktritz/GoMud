roomid: 10
zone: Rileys Neighborhood
title: Oak Street
description: Oak Street is busier than the residential blocks behind you. Cars rumble past at irregular intervals, and the sidewalk is wider, lined with a few small shops and awnings. You can see the corner store up ahead to the east and the familiar rooftops of the neighborhood stretching out to the west. A yellow school bus route sign is bolted to a lamppost. The street has that in-between feel -- not quite downtown, not quite suburban, just a regular city street trying its best.
