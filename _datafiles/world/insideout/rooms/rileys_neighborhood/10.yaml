nouns:
  cars: The <ansi fg="itemname">cars</ansi> parked along Oak Street are a mix of sensible hybrids and beat-up older models. A few have parking tickets tucked under their windshield wipers. One has a bumper sticker that reads "My Other Car Is Also Stuck In Traffic."
  sign: The yellow <ansi fg="itemname">school bus sign</ansi> marks a stop on the route to Riley's school. The schedule posted on the lamppost below it is sun-faded and basically unreadable.
idlemessages:
- A car honks somewhere up the block and someone yells something back.
- A yellow school bus rumbles past, windows full of bored faces.
- A delivery truck double-parks and the driver hops out with a stack of boxes.
- Someone on a bicycle weaves between parked cars.

