nouns:
  photos: The <ansi fg="itemname">family photos</ansi> tell the whole story. There's the Andersen family bundled up in parkas by a frozen lake. Riley as a toddler covered in birthday cake. Mom and Dad's wedding photo where Dad's tie is crooked. A recent one from a Giants game where everyone looks happy. The newest photo is from Riley's first San Francisco hockey game.
  tv: The <ansi fg="itemname">TV</ansi> is off right now. The remote is wedged between the couch cushions as usual. There's a smudge on the screen from the last time someone ate nachos while watching a movie.
  couch: The <ansi fg="itemname">couch</ansi> is the kind that swallows you whole when you sit down. It's got about six throw pillows too many and a fleece blanket stuffed into one corner. If you dig around in the cushions you'd probably find the remote, some popcorn kernels, and maybe a dollar fifty in change.
