title: Riley's Living Room
description: A cozy living room with hardwood floors and a big bay window letting in gray San Francisco light. Dad's oversized recliner sits in the corner next to a reading lamp and a stack of books about fly fishing. The couch is soft and broken-in, covered in throw pillows Mom picked out. A flat-screen TV is mounted on the wall, and the mantle above the fireplace is lined with family photos -- Minnesota winters, a trip to the Grand Canyon, Riley's first hockey game.
