title: Downstairs Bathroom
description: A small half-bathroom tucked under the stairs with barely enough room to turn around. The wallpaper has a faded seashell pattern that was here when they moved in and will probably be here forever. A tiny pedestal sink has a soap dispenser shaped like a whale -- Mom's touch. The toilet has one of those fuzzy lid covers that Dad thinks is ridiculous but knows better than to remove. A basket of magazines sits next to the toilet, mostly outdated.
