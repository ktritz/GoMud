nouns:
  soap: The <ansi fg="itemname">whale soap dispenser</ansi> is ceramic, blue, and has a little spout on top where the soap comes out. It's cute in a way that makes Dad sigh every time he washes his hands. The soap smells like lavender.
  wallpaper: The <ansi fg="itemname">seashell wallpaper</ansi> is peeling at the seams near the ceiling. Someone started to peel a corner once and Mom shut that down immediately. "We'll repaint when we repaint," she said, which means never.
idlemessages:
- The faucet drips once. Then again.
- The pipes rattle faintly behind the wall.
