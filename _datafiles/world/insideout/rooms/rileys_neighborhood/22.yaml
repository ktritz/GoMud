title: Dining Room
description: A dining room that doubles as homework central. The table is a big oak thing with mismatched chairs, one of which wobbles. Half the table is set for dinner with placemats and napkins; the other half is buried under textbooks, a laptop, and a science project that's been "almost done" for two weeks. A china cabinet in the corner holds dishes that only come out on holidays and a collection of souvenir mugs from every family road trip. The overhead light has a dimmer switch that Dad is very particular about.
