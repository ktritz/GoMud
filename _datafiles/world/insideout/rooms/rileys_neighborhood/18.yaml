nouns:
  ice: The <ansi fg="itemname">ice</ansi> is freshly resurfaced and almost mirror-smooth. You can see the faint reflection of the overhead lights on its surface. The red and blue lines are crisp and bright. Your fingers itch for your stick just looking at it.
  goals: The <ansi fg="itemname">goals</ansi> are regulation size with fresh white netting. Both have puck marks on the crossbars and posts from years of practice shots. The left goal has a water bottle perched on top of it -- the classic target.
  bleachers: The metal <ansi fg="itemname">bleachers</ansi> are cold even through your clothes. They seat maybe a hundred people on a good day. There are a few lost mittens and a forgotten scarf draped over the railing. During games, the parents get surprisingly loud for such a small space.
