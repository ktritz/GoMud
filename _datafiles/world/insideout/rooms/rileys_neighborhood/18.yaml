title: Hockey Rink
description: The Andersen Heights Ice Rink is a small indoor facility with that unmistakable cold, clean smell of ice and zamboni fumes. The rink itself gleams under bright overhead lights, its surface freshly resurfaced with smooth parallel lines. Metal bleachers line one side, and a pair of goals sit at either end of the ice. A banner on the wall reads "GO FOGHORNS!" in the local team's colors. There's a small equipment window near the entrance where you can talk to the coach. This place feels like home in a way the rest of San Francisco is still figuring out.
