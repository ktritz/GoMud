zone: Rileys Neighborhood
title: Pizza Parlor
description: The pizza place. THE pizza place. A neighborhood institution with red vinyl booths, checkered tablecloths, and the warm, overwhelming smell of baking dough and melted cheese. A glass counter displays slices of every variety, including the controversial San Francisco special with broccoli on it. A chalkboard menu hangs on the wall behind the register. The floor is slightly sticky in the way all good pizza places are. An old jukebox in the corner plays something from the '80s that nobody asked for.
