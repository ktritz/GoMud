nouns:
  bench: The metal <ansi fg="itemname">bench</ansi> is bolted to the concrete and covered in those armrest dividers designed to stop people from lying down. Someone has stuck a piece of gum underneath it. Actually, several someones have stuck several pieces of gum underneath it.
  schedule: 'The <ansi fg="itemname">bus schedule</ansi> is mostly unreadable from sun damage, but you can make out that the #38 bus runs every 15 minutes during school hours. Someone has drawn a mustache on the smiling bus driver in the header illustration.'
  bus: 'A big yellow <ansi fg="itemname">school bus</ansi> idles at the curb, its doors open with a pneumatic hiss. The route sign above the windshield reads "#38 - RILEY''S SCHOOL" in blocky orange letters. You could board the <ansi fg="exit-secret">bus</ansi> to head to school.'
idlemessages:
- A bus pulls up with a hydraulic hiss, pauses, and pulls away again.
- Someone checks their phone, looks up the street for the bus, checks their phone again.
- A crumpled bus transfer ticket tumbles across the sidewalk.
- The digital arrival sign flickers between "3 MIN" and "----" like it can't decide.
- Exhaust from a passing bus hangs in the foggy air for a moment.
