title: Bus Stop
description: A city bus stop with a scratched-up plexiglass shelter and a metal bench that's always either too hot or too cold. A posted schedule is taped behind plastic, half of it faded beyond legibility. This is the connection to the rest of San Francisco -- the bus that goes to school stops here every morning. The shelter has a faded advertisement for a museum exhibit that ended two months ago. To the east, a pedestrian bridge arches over toward the bay.
