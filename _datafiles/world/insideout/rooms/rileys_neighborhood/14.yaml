idlemessages:
- Something heavy shifts inside one of the dumpsters. You'd rather not know what.
- The buzzing light flickers, and for a second the alley goes completely dark.
- A cold draft pushes through the alley from nowhere in particular.
- You hear a faint scratching sound from inside the overturned dumpster.
