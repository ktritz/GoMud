nouns:
  pillows: The pillows are impossibly soft, the kind that make you want to sink in and never get up. Each one is a different shade of blue, from pale sky to deep ocean. They smell faintly of chamomile.
  books: 'The reading nook is stacked with well-thumbed books. Titles include "The Giving Tree," "Where the Red Fern Grows," and a dog-eared copy of "It''s Okay to Feel Sad: A Complete History." Several have tearstains on the pages.'
  teardrops: The glass teardrops hanging from the ceiling are beautiful in their sadness, each one perfectly formed and catching the soft blue light. They chime gently when the air shifts, making a sound like a music box winding down.
idlemessages:
- The sound of gentle rainfall grows slightly louder, then fades back to a whisper.
- One of the glass teardrops catches the light and sends a cascade of blue across the walls.
- A pillow slowly deflates with a soft sigh, as if the room itself is feeling blue.
- The books in the reading nook seem to rearrange themselves, putting the saddest ones on top.
