title: Sadness's Room
description: Sadness's room is small, cozy, and perpetually dim, like a rainy afternoon that never quite ends. The walls are painted in soft blues and grays, and every surface is covered in plush pillows, fuzzy blankets, and oversized stuffed animals. A gentle sound of rainfall plays from somewhere, though there's no visible source. Rain-themed decorations hang from the ceiling -- delicate glass teardrops that catch what little light there is and scatter it in pale blue patterns. A well-worn reading nook is built into one wall, stacked with books that all seem to have bittersweet endings. Despite the melancholy, there's something deeply comforting about this room, like a good cry that leaves you feeling lighter.
mapsymbol: S
maplegend: Sadness
