roomid: 215
zone: Headquarters
title: Headquarters Balcony
description: The open-air balcony extends out from the edge of Headquarters into the vast, dizzying expanse of Riley's mind. A railing is the only thing between you and a drop that seems to go on forever, descending past the towering shelves of Long Term Memory that stretch into the distance like an endless library built by giants. The shelves glow faintly with millions of stored memory orbs, their combined light creating a soft aurora effect in the air below. A narrow stairway carved into the outer wall of Headquarters winds downward, connecting to the memory shelves far below. The wind up here carries fragments of old memories -- a snatch of a lullaby, the smell of cookies baking, the echo of a friend's laugh. It's beautiful and a little terrifying.
mapsymbol: B
maplegend: Balcony
biome: mindscape
exits:
