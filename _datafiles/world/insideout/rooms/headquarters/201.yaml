roomid: 201
zone: Headquarters
title: Memory Intake
description: A cavernous room hums with constant activity as the memory intake system processes Riley's daily experiences. A long conveyor belt winds through the center of the chamber, carrying freshly formed memory orbs that glow in every color -- golden joy, blue sadness, red anger, purple fear, and green disgust. The orbs roll gently along the belt, each one a perfect sphere containing a tiny scene that plays on loop inside it. Sorting chutes line the walls, labeled with categories like "School," "Family," "Friends," and the suspiciously full "Embarrassing Moments." The air smells faintly of new experiences.
mapsymbol: M
maplegend: Memory
biome: mindscape
