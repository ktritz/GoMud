title: Personality Islands Overlook
description: A wide balcony juts out from the edge of Headquarters, offering a breathtaking panoramic view of the Personality Islands floating in the vast mindscape below. Each island is a towering structure of impossible architecture powered by Riley's core memories. Family Island glows warm with a cozy house perched on top. Hockey Island gleams with an ice rink that never melts. Friendship Island buzzes with connected pathways and shared spaces. Honesty Island stands solid and angular, built from transparent crystal. And the newest addition, Music Island, pulses with rhythm and streams colorful sound waves into the sky. The gaps between the islands reveal the dizzying drop to the memory shelves far, far below.
mapsymbol: O
maplegend: Overlook
biome: mindscape
