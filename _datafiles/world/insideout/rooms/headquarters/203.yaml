nouns:
  islands: The Personality Islands float like enormous platforms over the abyss, each one tethered to Headquarters by bridges of light. They shift and glow based on Riley's current activities -- when she's with friends, Friendship Island blazes bright, and the others dim slightly.
  family island: Family Island is warm and inviting, topped with a miniature version of Riley's childhood home. Soft golden light spills from its windows and the whole structure radiates safety and belonging.
  hockey island: Hockey Island is all sharp angles and gleaming ice, with a full rink spinning slowly at its peak. The sounds of skates on ice and cheering crowds drift across the gap.
  music island: The newest island pulses with vibrant energy. Enormous speakers and instruments sprout from its surface like a living concert stage, and waves of color ripple outward with every beat.
idlemessages:
- Family Island flares golden as Riley thinks about home.
- Hockey Island dims slightly -- Riley must not be thinking about sports right now.
- Music Island sends a ripple of purple and blue sound waves arcing across the sky.
- Friendship Island lights up and you can faintly hear laughter drifting from it.
- Far below, the memory shelves stretch to the horizon, millions of orbs glowing softly.
