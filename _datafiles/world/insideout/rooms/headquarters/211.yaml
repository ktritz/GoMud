nouns:
  posters: The motivational posters are an interesting mix. "PREPARE FOR THE WORST, HOPE FOR THE SLIGHTLY LESS WORST" hangs next to "You're Doing Fine (Probably)" and "HAVE YOU CONSIDERED ALL POSSIBLE OUTCOMES? (You Haven't.)" One poster just says "meh" in very small text -- that one is definitely Ennui's.
  welcome mat: The welcome mat has seen some editorial revisions. The original text reads "WELCOME, NEW EMOTIONS!" but it's been annotated several times. Anxiety added "Please review the safety protocols." Embarrassment added "(sorry for existing)." Ennui didn't add anything, which somehow says everything.
idlemessages:
- A poster peels slightly off the wall and then sticks itself back with anxious precision.
- The lights in the hallway flicker to a slightly more intense shade, then settle.
- A faint sigh drifts from somewhere down the hall. Ennui, probably.
- The welcome mat shifts slightly, as if embarrassed to be noticed.
