roomid: 211
zone: Headquarters
title: New Arrivals Wing
description: This wing of Headquarters has a noticeably different energy -- newer, sharper, a little more intense. When Riley hit puberty, the renovation crew showed up overnight and built this entire section to house the new emotions. The walls are a sleeker material than the rest of Headquarters, with a slightly more angular design. Motivational posters line the hallway (most of them put up by Anxiety, most of them about preparation). A large welcome mat at the entrance reads "NEW EMOTIONS THIS WAY" with an arrow, though someone has crossed out "welcome" and written "brace yourself" underneath. Doors branch off toward the newer emotion quarters, and the air crackles with the restless energy of a mind figuring out who it's becoming.
