  south:
    roomid: 207
nouns:
  drawings: Riley's artwork covers every available surface. Some are from childhood -- crayon stick figures and lopsided houses -- and some are more recent sketches. Joy has kept every single one, arranged in no particular order except "all of them are the best."
  corkboard: The corkboard is stuffed beyond capacity with sticky notes, each one an idea for making Riley's day better. "Compliment someone!" "Try that new song!" "Suggest pizza for dinner!" Several notes have gold star stickers on them, marking ideas that worked.
  puck: Riley's first hockey puck, scuffed and battered from hundreds of games. Joy keeps it front and center on the shelf, polished to a shine.
idlemessages:
- A burst of glitter drifts down from somewhere near the ceiling for no apparent reason.
- The drawings on the wall seem to glow a little brighter for a moment.
- A sticky note peels off the corkboard and flutters to the floor. It reads "SMILE MORE :)"
- The room pulses with golden warmth, as if Joy's optimism is a physical force.
