roomid: 206
zone: Headquarters
title: Joy's Room
description: 'Stepping through the doorway is like walking into bottled sunshine. The walls of Joy''s room are painted in every shade of yellow and gold, covered floor to ceiling with Riley''s drawings, photos, and happy memories pinned up with star-shaped tacks. A bed that looks like it''s never been slept in sits in the corner -- Joy has too much energy for sleep. Glitter seems to hang permanently in the air, catching the light that radiates from the room itself. A corkboard labeled "TOMORROW''S FUN IDEAS" is overflowing with sticky notes, and a small shelf holds a collection of Riley''s favorite things: a hockey puck, a family photo, and a friendship bracelet. The whole room practically vibrates with optimism.'
mapsymbol: J
maplegend: Joy
biome: mindscape
exits:
  west:
