roomid: 208
zone: Headquarters
title: Anger's Room
description: 'The temperature spikes the moment you step into Anger''s room. The walls are a deep, smoldering red, and thin wisps of steam curl up from vents in the floor. Newspapers are everywhere -- stacked on the desk, pinned to the walls, crumpled in the corners -- each one with headlines about things that are JUST NOT FAIR. A heavy punching bag hangs from the ceiling in one corner, visibly dented and patched in several places. A bookshelf holds nothing but complaint forms, grievance logs, and a single cookbook titled "Cooking With Rage: 50 Recipes For When Everything Is Wrong." The room rumbles faintly, like a volcano deciding whether today is the day.'
mapsymbol: A
maplegend: Anger
biome: mindscape
