nouns:
  newspapers: 'The newspapers are covered in headlines that would make anyone''s blood boil. "BROCCOLI ON PIZZA DECLARED ACCEPTABLE." "HOMEWORK OVER BREAK: TEACHERS SAY YES." "SCREEN TIME LIMITS LOWERED AGAIN." Several have angry red circles drawn around the worst offenses.'
  punching bag: The punching bag has taken an absolute beating. It's held together with duct tape and sheer stubbornness, and it still swings slightly as if it was just hit. A scorch mark on one side suggests Anger got particularly heated during a recent session.
  cookbook: '"Cooking With Rage" is surprisingly well-organized. Chapter titles include "Stress Baking At 2 AM," "Chopping Vegetables Like They Wronged You," and "How To Make Toast When The Toaster Betrays You Again." Several pages are singed around the edges.'
idlemessages:
- A newspaper on the desk bursts into flames briefly, then smolders out.
- The room temperature ticks up a few degrees and steam hisses from the floor vents.
- The punching bag swings on its own, as if struck by an invisible fist.
- A distant rumble shakes the room. The volcano metaphor is maybe not a metaphor.
- One of the complaint forms on the shelf spontaneously fills itself out.
