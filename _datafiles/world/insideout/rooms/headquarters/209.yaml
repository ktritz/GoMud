nouns:
  filing cabinet: The filing cabinet is stuffed to bursting. A quick glance at the tabs reveals entries like "Bear Attack (School)," "Bear Attack (Home)," "Bear Attack (Unlikely But What If Bears Learn To Open Doors)," and an entire section dedicated to "Social Situations That Could Go Wrong." The last section takes up three drawers.
  exit plans: The emergency exit plans are meticulous. Each one includes a color-coded map, a numbered list of steps, and a "panic level" rating from 1 to 10. The plan for "Someone Asks You A Question In Class" is rated an 8. The plan for "Actual Emergency" is, ironically, only a 6.
  night lights: Four night lights glow softly in the four corners of the room. Each one is a different color and each one has a backup battery taped to it, just in case. A label on one reads "DO NOT UNPLUG. EVER."
idlemessages:
- One of the night lights flickers and the room's ambient anxiety level spikes noticeably.
- The filing cabinet drawer labeled "NEW WORRIES" slides open slightly on its own.
- A small alarm clock on the desk goes off, labeled "REMINDER -- WORRY ABOUT TOMORROW."
- Something creaks in the walls and the emergency exit plans all flutter at once.
