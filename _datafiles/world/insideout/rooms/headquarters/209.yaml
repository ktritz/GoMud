roomid: 209
zone: Headquarters
title: Fear's Room
description: 'Fear''s room is the most organized space in all of Headquarters -- obsessively, almost disturbingly so. Every surface is labeled, every item catalogued, every potential hazard identified with a small warning sticker. Emergency exit plans are posted on every wall, each one for a different scenario: fire, flood, surprise quiz, awkward silence, "what if the sun just doesn''t come up one day." A massive filing cabinet dominates one wall, its drawers labeled "Worst Case Scenarios A-F," "Worst Case Scenarios G-L," and so on through the alphabet, with a supplementary cabinet for "Worst Case Scenarios: Unlikely But You Never Know." A night light glows in every corner. There are four of them.'
mapsymbol: F
maplegend: Fear
