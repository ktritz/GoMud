nouns:
  console: The console is a magnificent arc of controls stretching nearly wall to wall. Its surface is dotted with buttons in every color imaginable -- golden yellows, deep blues, fiery reds, sickly greens, and vivid purples. Some buttons glow steadily while others flicker, waiting to be pressed. A faint hum of energy radiates from it.
  screen: The massive screen shows Riley's live perspective. Right now she seems to be at school, the image slightly unfocused as if she's daydreaming. Occasionally the feed sharpens when something catches her attention.
  buttons: Hundreds of buttons cover the console in neat clusters. Each group controls a different aspect of Riley's emotional response. Some are well-worn from frequent use, while others look barely touched. A few have sticky notes attached reading things like "DO NOT PRESS DURING MATH CLASS."
idlemessages:
- The console flickers through a rapid sequence of golden and blue lights.
- A button on the console presses itself and a brief giggle echoes through the room.
- The screen shifts and Riley's perspective blurs for a moment as she blinks.
- The floor beneath your feet ripples from cool blue to warm yellow and back again.
- Somewhere in the room, a faint melody plays -- a half-remembered song from childhood.
