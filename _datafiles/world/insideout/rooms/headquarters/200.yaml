roomid: 200
zone: Headquarters
title: The Console Room
description: The heart of Riley's mind stretches out before you, a vast circular chamber dominated by the console -- a sprawling control panel covered in hundreds of colorful buttons, sliders, and levers that pulse with soft light. A massive screen mounted on the far wall shows Riley's point of view in real-time, the image shifting as she goes about her day. Five emotion stations ring the console, each tinted a different color and worn smooth from years of use. The floor is a polished surface that subtly shifts hue depending on Riley's current mood, and the domed ceiling above glows with a warm ambient light that makes everything feel alive and important. This is where every feeling starts.
