roomid: 205
zone: Headquarters
title: The Recall Tube
description: A massive pneumatic tube system dominates this room, its transparent cylinders stretching from floor to ceiling before vanishing into the walls and downward into the depths of the mind. The main tube is wide enough for a memory orb -- or even a person, if they were brave enough. A control panel with a single large button sits beside the tube, labeled "RECALL" in bold letters. Smaller tubes branch off in every direction, each one labeled with a category of memory. The whole system whooshes and hisses with compressed air as memories are sent and received at dizzying speed.
mapsymbol: T
maplegend: Tube
biome: mindscape
exits:
  east:
