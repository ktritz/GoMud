weapons:
  - id: 10001
    name: pencil
    simple: pencil
    desc: "A well-sharpened #2 pencil. They say the pen is mightier than the sword, and this is basically the same thing."
    damage: 1d2
    subtype: stabbing
    value: 5

  - id: 10002
    name: hockey stick
    simple: stick
    desc: "A sturdy composite hockey stick with tape wrapped around the blade. Riley would approve."
    damage: 1d4
    hands: 2
    subtype: bludgeoning
    value: 25

  - id: 10003
    name: textbook
    simple: textbook
    desc: "A heavy hardcover textbook on Advanced Algebra. Makes for surprisingly effective blunt-force education."
    damage: 1d3
    subtype: bludgeoning
    value: 15

  - id: 10004
    name: memory orb shard
    simple: shard
    desc: "A jagged fragment of a shattered memory orb. It still glimmers with the ghost of whatever memory it once held, and its edges are razor sharp."
    damage: 1d4+1
    subtype: slashing
    value: 40

  - id: 10005
    name: imagination sword
    simple: sword
    desc: "A brilliantly colored sword that seems to be made of pure imagination. It shifts between crayon-bright colors and sometimes sprouts sparkles."
    damage: 1d6
    subtype: slashing
    value: 75

  - id: 10006
    name: dream prop blade
    simple: blade
    desc: "A surprisingly convincing prop sword from Dream Productions. Someone wrote 'HERO WEAPON' on the handle in marker, but it hits like the real thing."
    damage: 1d6+1
    subtype: slashing
    value: 100

  - id: 10007
    name: abstract edge
    simple: edge
    desc: "A weapon that shouldn't exist in three dimensions but somehow does. Its blade is a geometric impossibility - a Penrose triangle sharpened to a point."
    damage: 1d8
    subtype: slashing
    value: 150

  - id: 10008
    name: fear fang dagger
    simple: dagger
    desc: "A curved dagger forged from a crystallized fear. It's always slightly cold to the touch, and looking at it too long makes you uneasy."
    damage: 1d8+1
    subtype: stabbing
    statmods: {speed: 1}
    value: 200

  - id: 10009
    name: "bing bong's candy cane"
    simple: cane
    desc: "Bing Bong's oversized candy cane from his rocket wagon. It smells like cotton candy and bubblegum, and sparkles leave a trail wherever you swing it. Who's your friend who likes to play?"
    damage: 2d4
    hands: 2
    subtype: bludgeoning
    value: 120

  - id: 10010
    name: "jangles' joy buzzer"
    simple: buzzer
    desc: "A giant novelty joy buzzer ripped from the hand of Jangles the Clown himself. It crackles with residual terror and makes a horrible BZZZT sound on impact."
    damage: 2d6
    subtype: bludgeoning
    value: 350

  - id: 10011
    name: core memory staff
    simple: staff
    desc: "A staff with a brilliant golden core memory orb set into its head. The orb pulses with warmth and light, and the whole weapon hums with the power of Riley's most important memories."
    damage: 2d5
    hands: 2
    subtype: bludgeoning
    statmods: {smarts: 3}
    value: 400

  - id: 10012
    name: void shard blade
    simple: blade
    desc: "A blade forged from the crystallized darkness of the Memory Dump. It's heavier than it looks, and the void-black edge seems to drink in the light around it."
    damage: 2d6
    subtype: slashing
    statmods: {strength: 2}
    value: 500

  - id: 10013
    name: emotion amplifier wand
    simple: wand
    desc: "A slender wand topped with a multi-colored gemstone that resonates with emotional energy. It amplifies the wielder's feelings into raw magical force."
    damage: 1d6+2
    subtype: bludgeoning
    statmods: {mysticism: 5}
    value: 200

  - id: 10014
    name: rubber band slingshot
    simple: slingshot
    desc: "A classic Y-shaped slingshot made from a tree branch and thick rubber bands. Perfect for launching memory orb fragments at things that annoy you."
    damage: 1d3
    subtype: shooting
    value: 10

  - id: 10015
    name: broccoli flail
    simple: flail
    desc: "A morning star made entirely of broccoli. It's as disgusting as it is effective. Disgust would NOT approve."
    damage: 1d6
    subtype: bludgeoning
    value: 80

armor:
