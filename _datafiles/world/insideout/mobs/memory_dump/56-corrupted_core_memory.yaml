  description: A core memory that has been consumed by the void and become something terrible. It pulses with shifting dark colors -- corrupted versions of joy's gold turned to sickly amber, sadness's blue curdled to bruise-black, anger's red bleeding into a deep, infected crimson, fear's purple gone hollow and vacant, disgust's green rotted to a gangrenous brown. It was once one of Riley's most important memories, the kind that defines who you are, but the Memory Dump has twisted it into a howling vortex of everything those emotions were never meant to be. It radiates a wrongness you can feel in your bones, and the air around it tastes like the moment before you forget something you swore you'd never forget. This is where memories come to die, and this one has decided to take everything else with it.
