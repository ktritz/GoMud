character:
  name: bing bong
  description: Bing Bong is Riley's old imaginary friend -- part cat, part elephant, part dolphin, and made entirely of cotton candy. His body is a soft, faded pink, with a long elephant trunk, delicate cat whiskers, and small dolphin fins sprouting from his back. He carries a bottomless bag slung over one shoulder and wears a tiny bowler hat perched between his mismatched ears. He used to power a rocket wagon with song, soaring through Riley's imagination on adventures that felt bigger than the whole world. Now he lives here in Long Term Memory, wandering the endless shelves and keeping himself busy, though there is a loneliness in his eyes that no amount of cheerfulness can quite hide. He still believes, with every fiber of his cotton candy heart, that Riley will come back for him someday.
  level: 99
  raceid: 6
