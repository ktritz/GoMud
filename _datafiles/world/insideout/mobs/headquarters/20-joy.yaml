character:
  name: joy
  description: Joy is a radiant, golden-skinned emotion who literally glows with warm light, illuminating every room she enters. Her short, pixie-cut blue hair bounces with every enthusiastic gesture, and her enormous smile never quite fades even when she's trying to be serious. She wears a bright yellow-green dress that shimmers like sunlight on water, and tiny golden sparks trail behind her when she moves. As the self-appointed leader of Riley's emotions, she carries herself with boundless optimism and an almost manic energy, constantly looking for the bright side of every situation. Her eyes sparkle with an infectious warmth that makes it impossible not to feel a little happier just being near her.
