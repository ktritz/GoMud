  description: Disgust is a sleek, fashion-forward emotion with vivid green skin and perfectly styled emerald hair that frames her face like she just walked off a runway. Her half-lidded eyes and perpetually arched eyebrow convey a level of judgment that could wilt flowers. She wears a stylish scarf and an outfit that somehow manages to look effortlessly chic while everyone else in Headquarters is a mess. Her primary job is protecting Riley from physical and social poison -- bad food, bad fashion, and bad social decisions alike. She inspects everything with the critical eye of a food critic visiting a gas station, but underneath her withering sarcasm she truly cares about keeping Riley safe from embarrassment and things that are just, like, totally gross.
