character:
  name: anxiety
  description: Anxiety is a wiry, orange-skinned emotion with a manic, electric energy that fills any room she enters. Her wild orange hair literally stands straight up, crackling with nervous static, and her enormous eyes are always slightly too wide, as if she's permanently caffeinated. She talks at roughly twice the speed of anyone else, her words tumbling over each other in a breathless torrent of worst-case planning and contingency strategies. She fidgets constantly -- wringing her hands, pacing in tight circles, compulsively making lists on a notepad she pulls from thin air. Unlike Fear, who reacts to immediate danger, Anxiety is fixated on the future and all the terrible things that might happen. She genuinely means well and desperately wants to protect Riley, but her well-intentioned planning has a tendency to spiral into full catastrophic overdrive.
  level: 99
  raceid: 2
