  description: Jangles the Clown is the thing that lives in the deepest, darkest pit of Riley's subconscious -- a towering, nightmarish clown that makes every other fear in here look like a mild inconvenience. His peeling white makeup is cracked like old porcelain, revealing something dark and wrong underneath. His smile stretches impossibly wide, painted in a red that looks less like makeup and more like a warning. Oversized shoes squeak with each thundering step, and his eyes glow an unnatural, sickly yellow that tracks you with predatory focus. He carries an enormous mallet in one hand and clutches a bicycle horn in the other, honking it at moments calculated for maximum terror. This is the fear that keeps Riley awake at night, the one that the other fears lock behind the heaviest door they can find.
