  description: Riley's Dad is a tall, warm-eyed man with a slightly goofy mustache and the unmistakable air of someone who thinks he's much funnier than he actually is. He wears a comfortable flannel shirt and has the relaxed posture of a guy who'd rather be watching hockey than doing almost anything else. He moved the family from Minnesota to San Francisco for work, and he's doing his best to keep everyone happy -- mostly through an endless supply of terrible puns and a genuine, if occasionally clueless, devotion to his family. His inner emotions are famously preoccupied with hockey and classic rock.
